async function guardarPedido(id){

  let descripcion = document.getElementById('pd-descripcion').value.trim();
  if(!descripcion && lineas.length) descripcion = lineas.map(l=>l.descripcion).join(', ');
  if(!descripcion){ toast('Describe el pedido o añade al menos una línea de artículo', true); return; }
  const data = {
    proveedorId,
    obraId: document.getElementById('pd-obra').value || null,
    descripcion,
    lineas,
    fechaPedido: document.getElementById('pd-fechapedido').value || todayISO(),
    fechaEstimada: document.getElementById('pd-fechaestimada').value || null,
    notas: document.getElementById('pd-notas').value.trim(),
  };
  if(id){ Object.assign(state.pedidos.find(x=>x.id===id), data); }
  else { state.pedidos.push({id:uid(), estado:'Pendiente', ...data}); }
  await persist('pedidos');
  toast('Pedido guardado');
  closeModal();
}

async function registrarMovimientoStock(articuloId, tipo, cantidad, motivo, origen){
  let s = state.stock.find(x=>x.articuloId===articuloId);
  if(!s){ s = {id:uid(), articuloId, cantidad:0, stockMinimo:0, ubicacion:'', notas:''}; state.stock.push(s); }
  s.cantidad = Math.round((s.cantidad + (tipo==='entrada'? Math.abs(cantidad) : -Math.abs(cantidad)))*1000)/1000;
  state.movimientosStock.push({id:uid(), articuloId, fecha:todayISO(), tipo, cantidad:Math.abs(cantidad), motivo, origen});
  await persist('stock');
  await persist('movimientosStock');
}

    <div class="field"><label>Artículo</label><select id="st-articulo">${ordenado.map(a=>`<option value="${a.id}" ${pre===a.id?'selected':''}>${esc(a.nombre)}</option>`).join('')}</select></div>

    </div>

          ${state.__openMenuStock===s.id? `<div class="dropdown-menu" onclick="event.stopPropagation()">

  html += `</div>`;
  if(state.__openMenuStock) html += `<div class="menu-backdrop" onclick="state.__openMenuStock=null; render();"></div>`;
  return html;
}

async function cambiarObraTrabajador(trabajadorId, nuevaObraId){
  const t = state.trabajadores.find(x=>x.id===trabajadorId); if(!t) return;
  nuevaObraId = nuevaObraId || null;
  if(t.obraActualId===nuevaObraId) return;
  const hoy = todayISO();
  t.historialObras = t.historialObras || [];
  if(t.obraActualId){
    const abierta = [...t.historialObras].reverse().find(h=>h.obraId===t.obraActualId && !h.fechaFin);
    if(abierta) abierta.fechaFin = hoy;
  }
  if(nuevaObraId){
    t.historialObras.push({id:uid(), obraId:nuevaObraId, fechaInicio:hoy, fechaFin:null});
  }
  t.obraActualId = nuevaObraId;
  await persist('trabajadores');
  const nombreDestino = nombreUbicacionTrabajador(nuevaObraId);
  toast(nombreDestino? 'Trabajador movido a "'+nombreDestino+'"' : 'Trabajador desasignado de la obra');
  render();
}
window.cambiarObraTrabajador = cambiarObraTrabajador;
async function eliminarMovimientoObra(trabajadorId, movimientoId){
  const t = state.trabajadores.find(x=>x.id===trabajadorId); if(!t) return;
  const mov = (t.historialObras||[]).find(h=>h.id===movimientoId);
  if(!mov){ toast('Ese movimiento ya no existe', true); return; }
  const esActual = !mov.fechaFin;
  const avisoActual = esActual? '\n\nEs el periodo actual — si lo borras, la persona quedará sin ubicación asignada.' : '';
  if(!confirm('¿Eliminar este movimiento del historial?'+avisoActual)) return;
  t.historialObras = t.historialObras.filter(h=>h.id!==movimientoId);
  if(esActual && mov.obraId===t.obraActualId){ t.obraActualId = null; }
  await persist('trabajadores');
  toast('Movimiento eliminado');
  render();
}
window.eliminarMovimientoObra = eliminarMovimientoObra;
const DIAS_SEMANA_KEYS = ['lunes','martes','miercoles','jueves','viernes','sabado','domingo'];
const DIAS_SEMANA_LABEL = {lunes:'Lun',martes:'Mar',miercoles:'Mié',jueves:'Jue',viernes:'Vie',sabado:'Sáb',domingo:'Dom'};
const HORARIO_DEFAULT = {
  lunes:true,martes:true,miercoles:true,jueves:true,viernes:true,sabado:false,domingo:false,
  horaEntrada:'08:00',horaSalida:'17:00',
  intensivaActiva:false, intensivaInicio:null, intensivaFin:null, intensivaEntrada:'07:00', intensivaSalida:'14:00',
};
function horarioTrabajador(t){ return {...HORARIO_DEFAULT, ...(t.horario||{})}; }
function esDiaLaborable(t, fechaISO){
  const h = horarioTrabajador(t);
  const d = new Date(fechaISO+'T00:00:00');
  const idx = (d.getDay()+6)%7;
  return !!h[DIAS_SEMANA_KEYS[idx]];
}
function esJornadaIntensiva(t, fechaISO){
  const h = horarioTrabajador(t);
  return !!(h.intensivaActiva && h.intensivaInicio && h.intensivaFin && fechaISO>=h.intensivaInicio && fechaISO<=h.intensivaFin);
}
function horarioEfectivo(t, fechaISO){
  const h = horarioTrabajador(t);
  const intensiva = esJornadaIntensiva(t, fechaISO);
  return {
    intensiva,
    horaEntrada: intensiva? h.intensivaEntrada : h.horaEntrada,
    horaSalida: intensiva? h.intensivaSalida : h.horaSalida,
  };
}
async function actualizarHorario(trabajadorId, campo, val){
  const t = state.trabajadores.find(x=>x.id===trabajadorId); if(!t) return;
  t.horario = t.horario ? {...HORARIO_DEFAULT, ...t.horario} : {...HORARIO_DEFAULT};
  t.horario[campo] = val;
  await persist('trabajadores');
  render();
}
window.actualizarHorario = actualizarHorario;
function diasEntre(fechaInicio, fechaFin){
  if(!fechaInicio) return 0;
  const d1 = new Date(fechaInicio+'T00:00:00'), d2 = new Date((fechaFin||todayISO())+'T00:00:00');
  return Math.max(1, Math.round((d2-d1)/86400000)+1);
}
async function eliminarTrabajador(id){
  const t = state.trabajadores.find(x=>x.id===id);
  if(!t){ toast('Ese trabajador ya no existe (puede que se haya eliminado ya).', true); state.__openMenuTrabajador=null; render(); return; }
  const enObra = t.obraActualId && t.obraActualId!==OFICINA_ID ? state.obras.find(o=>o.id===t.obraActualId) : null;
  const avisoObra = enObra? '\n\nAviso: sigue asignado a la obra "'+enObra.nombre+'". Se le desasignará al eliminarlo.' : '';
  if(!confirm('¿Eliminar a '+t.nombre+'? También se eliminarán su foto, documentos adjuntos, ausencias e historial.'+avisoObra)) return;
  try{
    state.trabajadores = state.trabajadores.filter(x=>x.id!==id);
    await persist('trabajadores');
    try{ await window.storage.delete('trabajador_media:'+id, false); }catch(e){}
    delete state.trabajadorMedia[id];
    if(state.trabajadorDetailId===id) state.trabajadorDetailId=null;
    state.__openMenuTrabajador=null;
    closeModal();
    toast('Trabajador eliminado');
    render();
  }catch(err){
    toast('No se pudo eliminar: '+(err&&err.message? err.message : 'error desconocido')+'. Inténtalo de nuevo.', true);
  }
}
window.eliminarTrabajador = eliminarTrabajador;
function toggleMenuTrabajador(id){ state.__openMenuTrabajador = state.__openMenuTrabajador===id?null:id; render(); }
window.toggleMenuTrabajador = toggleMenuTrabajador;

function diasAusencia(v){
  if(!v.fechaInicio||!v.fechaFin) return 0;
  const d1 = new Date(v.fechaInicio+'T00:00:00'), d2 = new Date(v.fechaFin+'T00:00:00');
  return Math.max(1, Math.round((d2-d1)/86400000)+1);
}

async function ensureObraMediaLoaded(id){
  if(state.obraMedia[id]!==undefined) return state.obraMedia[id];
  try{ const r = await window.storage.get('obra_media:'+id, false); state.obraMedia[id] = r&&r.value? JSON.parse(r.value) : {imagen:null, documentos:[]}; }
  catch(e){ state.obraMedia[id] = {imagen:null, documentos:[]}; }
  render();
  return state.obraMedia[id];
}
async function ensureTrabajadorMediaLoaded(id){
  if(state.trabajadorMedia[id]!==undefined) return state.trabajadorMedia[id];
  try{ const r = await window.storage.get('trabajador_media:'+id, false); state.trabajadorMedia[id] = r&&r.value? JSON.parse(r.value) : {imagen:null, documentos:[]}; }
  catch(e){ state.trabajadorMedia[id] = {imagen:null, documentos:[]}; }
  render();
  return state.trabajadorMedia[id];
}
async function handleObraImagenChange(obraId, inputEl){
  const file = inputEl.files[0]; if(!file) return;
  if(!file.type.startsWith('image/')){ toast('Selecciona un archivo de imagen', true); inputEl.value=''; return; }
  try{
    const raw = await fileToDataURL(file);
    abrirRecortarFoto(raw, 'obra', obraId);
  }catch(e){ toast('No se pudo cargar la imagen', true); }
  inputEl.value='';
}
window.handleObraImagenChange = handleObraImagenChange;
async function eliminarObraImagen(obraId){

  media.imagen = null;

}

async function handleTrabajadorDocumentoChange(trabajadorId, inputEl){
  const files = Array.from(inputEl.files||[]); if(!files.length) return;
  toast('Subiendo documento(s)…');
  const media = state.trabajadorMedia[trabajadorId] || {imagen:null, documentos:[]};
  media.documentos = media.documentos || [];
  for(const file of files){
    if(file.size > 3*1024*1024){ toast('"'+file.name+'" supera los 3 MB y se ha omitido.', true); continue; }
    try{ const dataUrl = await fileToDataURL(file); media.documentos.push({id:uid(), nombre:file.name, tipo:file.type, size:file.size, dataUrl, fecha: todayISO()}); }
    catch(e){}
  }
  state.trabajadorMedia[trabajadorId] = media;
  await persistRaw('trabajador_media:'+trabajadorId, media);
  toast('Documento(s) adjuntado(s)');
  inputEl.value=''; render();
}
window.handleTrabajadorDocumentoChange = handleTrabajadorDocumentoChange;

      ${ausencias.map(v=>{ const c = colorPermiso(v.tipo); return `<tr>
        <td><select style="color:${c};font-weight:600;" onchange="actualizarAusencia('${t.id}','${v.id}','tipo',this.value)">
          ${permisosParaRol(t.rol).map(tp=>`<option ${v.tipo===tp?'selected':''}>${esc(tp)}</option>`).join('')}
        </select></td>
        <td><input type="date" value="${v.fechaInicio||''}" onchange="actualizarAusencia('${t.id}','${v.id}','fechaInicio',this.value)"></td>
        <td><input type="date" value="${v.fechaFin||''}" onchange="actualizarAusencia('${t.id}','${v.id}','fechaFin',this.value)"></td>
        <td class="num">${diasAusencia(v)}</td>
        <td><input value="${esc(v.notas||'')}" style="min-width:100px;" onchange="actualizarAusencia('${t.id}','${v.id}','notas',this.value)"></td>
        <td><button class="icon-btn" onclick="quitarAusencia('${t.id}','${v.id}')">${ICON_TRASH}</button></td>
      </tr>`; }).join('')}
    </tbody></table></div>` : `<div class="empty" style="padding:16px;">${ICON_EMPTY}<div>Sin ausencias registradas.</div></div>`}
  </div>`;

  const epis = t.epis||[];
  const episCard = `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <h3 style="border:none;padding:0;margin:0;">EPIs entregados</h3>
      <button class="btn btn-sm" onclick="agregarEpi('${t.id}')">${ICON_PLUS}Añadir EPI</button>
    </div>
    ${epis.length? `<div style="overflow-x:auto;"><table style="margin-top:12px;"><thead><tr><th>Equipo</th><th>Talla</th><th>Entrega</th><th>Caducidad</th><th></th></tr></thead><tbody>
      ${epis.map(e=>{ const caducado = e.fechaCaducidad && e.fechaCaducidad<hoy; return `<tr ${caducado?'style="background:var(--danger-soft);"':''}>
        <td><input value="${esc(e.nombre)}" placeholder="Ej. Casco, Guantes, Arnés…" style="min-width:120px;" onchange="actualizarEpi('${t.id}','${e.id}','nombre',this.value)"></td>
        <td><input value="${esc(e.talla||'')}" style="width:70px;" onchange="actualizarEpi('${t.id}','${e.id}','talla',this.value)"></td>
        <td><input type="date" value="${e.fechaEntrega||''}" onchange="actualizarEpi('${t.id}','${e.id}','fechaEntrega',this.value)"></td>
        <td><input type="date" value="${e.fechaCaducidad||''}" onchange="actualizarEpi('${t.id}','${e.id}','fechaCaducidad',this.value)">${caducado?' ⚠ caducado':''}</td>
        <td><button class="icon-btn" onclick="quitarEpi('${t.id}','${e.id}')">${ICON_TRASH}</button></td>
      </tr>`; }).join('')}
    </tbody></table></div>` : `<div class="empty" style="padding:16px;">${ICON_EMPTY}<div>Sin EPIs registrados todavía (casco, guantes, arnés, botas de seguridad…).</div></div>`}
  </div>`;

  const documentos = (media && media.documentos) || [];
  const documentosCard = `<div class="card">
    <h3>Documentos adjuntos</h3>
    ${cargando? `<div class="empty" style="padding:16px;">Cargando…</div>` : documentos.length? `<table><tbody>
      ${documentos.map(d=>`<tr>
        <td><a href="#" onclick="previsualizarDocumento('trabajador','${t.id}','${d.id}'); return false;" style="color:var(--text-primary);text-decoration:none;">${docBadge(d.tipo)} ${esc(d.nombre)}</a><div class="muted" style="font-size:11px;margin-top:2px;">${fmtBytes(d.size)} · ${fmtFecha(d.fecha)}</div></td>
        <td style="text-align:right;white-space:nowrap;"><a href="${d.dataUrl}" download="${esc(d.nombre)}" class="icon-btn" title="Descargar">${ICON_FILE}</a><button class="icon-btn" onclick="eliminarTrabajadorDocumento('${t.id}','${d.id}')" title="Eliminar">${ICON_TRASH}</button></td>

  html += `<div class="detail-grid trabajador-detail-grid"><div>${vacacionesCard}${episCard}${documentosCard}</div><div>${fotoCard}${datosCard}${horarioCard}${laboralCard}${historialCard}</div></div>`;

/* ================= CONTROL DE PERSONAL (obra + calendario de ausencias) ================= */
function mondayOf(dateISO){
  const d = new Date(dateISO+'T00:00:00');
  const day = (d.getDay()+6)%7;
  d.setDate(d.getDate()-day);
  return fechaLocalISO(d);
}
function cambiarSemanaControl(delta){
  state.controlSemana = addDiasISO(state.controlSemana || mondayOf(todayISO()), delta*7);
  render();
}
window.cambiarSemanaControl = cambiarSemanaControl;
function abrirRegistrarAusencia(fechaPrefill){ openModal('registrarAusencia', null, null, {fecha: fechaPrefill||null}); }
window.abrirRegistrarAusencia = abrirRegistrarAusencia;
function modalRegistrarAusencia(){
  const hoy = todayISO();
  const fechaPre = (state.modal.extra||{}).fecha || hoy;
  const activos = state.trabajadores.filter(t=>!t.fechaBaja || t.fechaBaja>hoy);
  if(!activos.length) return `<h3>Registrar ausencia</h3><div class="hint">No hay trabajadores activos.</div><div class="modal-foot"><button class="btn" onclick="closeModal()">Cerrar</button></div>`;
  const primerRol = activos[0]? (activos[0].rol||'') : '';
  const motivosIniciales = permisosParaRol(primerRol);
  return `<h3>Registrar ausencia</h3>
    <div class="field"><label>Trabajador</label><select id="ra-trabajador" onchange="refrescarMotivosAusencia()">${activos.map(t=>`<option value="${t.id}" data-rol="${esc(t.rol||'')}">${esc(t.nombre)}</option>`).join('')}</select></div>
    <div class="field"><label>Motivo</label><select id="ra-tipo">${motivosIniciales.map(tp=>`<option>${esc(tp)}</option>`).join('')}</select></div>
    <div class="row">
      <div class="field"><label>Desde</label><input type="date" id="ra-desde" value="${fechaPre}"></div>
      <div class="field"><label>Hasta</label><input type="date" id="ra-hasta" value="${fechaPre}"></div>
    </div>
    <div class="field"><label>Notas (opcional)</label><input id="ra-notas" placeholder="Ej. Justificante entregado…"></div>
    <div class="modal-foot"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="confirmarRegistrarAusencia()">Guardar</button></div>`;
}
function refrescarMotivosAusencia(){
  const selTrab = document.getElementById('ra-trabajador');
  const selTipo = document.getElementById('ra-tipo');
  if(!selTrab || !selTipo) return;
  const rol = selTrab.selectedOptions[0]? selTrab.selectedOptions[0].dataset.rol : '';
  const permitidos = permisosParaRol(rol);
  selTipo.innerHTML = permitidos.map(tp=>`<option>${esc(tp)}</option>`).join('');
}
window.refrescarMotivosAusencia = refrescarMotivosAusencia;
async function confirmarRegistrarAusencia(){
  const trabajadorId = document.getElementById('ra-trabajador').value;
  const tipo = document.getElementById('ra-tipo').value;
  const desde = document.getElementById('ra-desde').value;
  const hasta = document.getElementById('ra-hasta').value || desde;
  const notas = document.getElementById('ra-notas').value.trim();
  if(!trabajadorId || !desde){ toast('Indica trabajador y fecha', true); return; }
  await agregarAusencia(trabajadorId, tipo, desde, hasta, notas);
  closeModal();
  toast('Ausencia registrada');
}
window.confirmarRegistrarAusencia = confirmarRegistrarAusencia;
function soltarTrabajadorEnObra(ev, obraId){
  ev.preventDefault();
  document.querySelectorAll('.dropzone-obra').forEach(z=>z.classList.remove('drag-over'));
  const trabajadorId = ev.dataTransfer.getData('text/plain');
  if(!trabajadorId) return;
  cambiarObraTrabajador(trabajadorId, obraId || null);
}
window.soltarTrabajadorEnObra = soltarTrabajadorEnObra;
function renderControlPersonal(){
  const hoy = todayISO();
  const activos = state.trabajadores.filter(t=>!t.fechaBaja || t.fechaBaja>hoy);
  const obrasActivas = state.obras.filter(o=>o.estadoObra!=='Finalizada');

  activos.forEach(t=>{ const key = t.obraActualId||'__sin__'; (grupos[key]=grupos[key]||[]).push(t); });
  const clavesOrdenadas = [OFICINA_ID, ...obrasActivas.map(o=>o.id), '__sin__'];

  const filasPorObra = clavesOrdenadas.map(key=>{
    const esOficina = key===OFICINA_ID;
    const obra = (key==='__sin__'||esOficina)? null : state.obras.find(o=>o.id===key);
    const grupo = grupos[key] || [];
    const dropId = key==='__sin__'? '' : key;
    const colorObra = esOficina? '#3E6E8E' : (obra? (ESTADO_OBRA_COLOR[obra.estadoObra]||'#6B6C70') : '#A2A3A6');

    return `<div class="dropzone-obra" data-obra="${dropId}" ondragover="event.preventDefault(); this.classList.add('drag-over');" ondragleave="this.classList.remove('drag-over');" ondrop="soltarTrabajadorEnObra(event,'${dropId}')" style="margin-bottom:14px;padding:10px 12px;border-radius:10px;border-left:4px solid ${colorObra} !important;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
        <div style="font-weight:700;font-size:12.5px;color:var(--text-primary);">${etiqueta}</div>
        <span class="tag" style="background:${hexToRgba(colorObra,0.16)};color:${colorObra};">${grupo.length} persona${grupo.length===1?'':'s'}</span>
      </div>
      ${grupo.length? grupo.map(t=>{
        const ausenciaHoy = ausenciaEnFecha(t, hoy);
        const colorAus = ausenciaHoy? colorPermiso(ausenciaHoy.tipo) : null;
        const laborableHoy = esDiaLaborable(t, hoy);
        let estadoHoyTag;
        if(ausenciaHoy) estadoHoyTag = `<span class="tag" style="background:${hexToRgba(colorAus,0.16)};color:${colorAus};flex:0 0 auto;">${esc(ausenciaHoy.tipo)}</span>`;
        else if(!laborableHoy) estadoHoyTag = `<span class="tag" style="flex:0 0 auto;">Libra hoy</span>`;
        else estadoHoyTag = `<span class="tag" style="background:var(--ok-soft);color:var(--ok);flex:0 0 auto;">Trabaja hoy</span>`;
        return `<div class="personal-drag-row" draggable="true" ondragstart="event.dataTransfer.setData('text/plain','${t.id}'); this.classList.add('dragging');" ondragend="this.classList.remove('dragging'); document.querySelectorAll('.dropzone-obra').forEach(z=>z.classList.remove('drag-over'));" style="display:flex;align-items:center;gap:10px;padding:7px 4px;border-bottom:1px solid var(--border);cursor:grab;">
          <span class="muted" style="font-size:13px;flex:0 0 auto;" title="Arrastra para cambiar de obra">⠿</span>
          ${avatarHtml(state.trabajadorMedia[t.id], t.nombre, 30)}
          <a href="#" onclick="editarTrabajador('${t.id}'); return false;" style="flex:1;min-width:0;color:var(--text-primary);text-decoration:none;font-weight:600;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(t.nombre)}</a>
          ${estadoHoyTag}
        </div>`;
      }).join('') : `<div class="hint" style="padding:6px 4px;">Suelta aquí para asignar.</div>`}
    </div>`;
  }).join('');

  if(!state.controlSemana) state.controlSemana = mondayOf(hoy);
  const semanaInicio = state.controlSemana;
  const diasSemana = [0,1,2,3,4,5,6].map(i=>addDiasISO(semanaInicio, i));
  const nombresDia = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
  const filaCalendario = activos.map(t=>{
    return `<tr>
      <td style="white-space:nowrap;"><div style="display:flex;align-items:center;gap:8px;">${avatarHtml(state.trabajadorMedia[t.id], t.nombre, 24)}<span style="font-size:12px;font-weight:600;">${esc(t.nombre)}</span></div></td>
      ${diasSemana.map(fecha=>{
        const laborable = esDiaLaborable(t, fecha);
        const aus = laborable? ausenciaEnFecha(t, fecha) : null;
        let simbolo, c, titulo;
        if(!laborable){ simbolo='–'; c='#A2A3A6'; titulo='No laborable'; }
        else if(aus){ simbolo='✕'; c=colorPermiso(aus.tipo); titulo=aus.tipo; }
        else { const ef = horarioEfectivo(t, fecha); simbolo=ef.intensiva?'☀':'✓'; c=ef.intensiva?'#C74A11':'#20794A'; titulo='Trabaja '+ef.horaEntrada+'–'+ef.horaSalida+(ef.intensiva?' (jornada intensiva)':''); }
        return `<td style="text-align:center;${fecha===hoy?'background:var(--surface-2);':''}"><span title="${esc(titulo)}" style="display:inline-block;width:20px;height:20px;border-radius:5px;background:${hexToRgba(c,0.18)};color:${c};font-size:11px;line-height:20px;font-weight:700;">${simbolo}</span></td>`;
      }).join('')}
    </tr>`;
  }).join('');

  return `<div class="card" style="margin-bottom:18px;">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
      <h3 style="border:none;padding:0;margin:0;">Control de personal</h3>
      <button class="btn btn-sm no-print" onclick="abrirRegistrarAusencia()">${ICON_PLUS}Registrar ausencia</button>
    </div>
    <div class="row" style="margin-top:16px;align-items:flex-start;">
      <div style="flex:1;min-width:240px;">
        <div class="hint" style="margin-bottom:10px;text-transform:uppercase;font-size:11px;font-weight:700;letter-spacing:.4px;">Quién está en cada obra</div>
        ${filasPorObra || `<div class="hint">Sin personal activo.</div>`}
      </div>
      <div style="flex:2;min-width:320px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px;">
          <div class="hint" style="text-transform:uppercase;font-size:11px;font-weight:700;letter-spacing:.4px;">Semana del ${fmtFecha(semanaInicio)}</div>
          <div style="display:flex;gap:6px;">
            <button class="btn btn-icon" onclick="cambiarSemanaControl(-1)">‹</button>
            <button class="btn btn-sm" onclick="state.controlSemana=mondayOf(todayISO()); render();">Hoy</button>
            <button class="btn btn-icon" onclick="cambiarSemanaControl(1)">›</button>
          </div>
        </div>
        <div style="overflow-x:auto;">
        <table><thead><tr><th>Trabajador</th>${diasSemana.map((f,i)=>`<th style="text-align:center;${f===hoy?'background:var(--accent-soft);color:var(--accent-text);border-radius:6px 6px 0 0;':''}">${nombresDia[i]}<br><span class="${f===hoy?'':'muted'}" style="font-weight:${f===hoy?'700':'400'};">${f.slice(8,10)}${f===hoy?' · hoy':''}</span></th>`).join('')}</tr></thead>
        <tbody>${filaCalendario || `<tr><td colspan="8" class="muted" style="padding:14px;">Sin personal activo.</td></tr>`}</tbody></table>
        </div>
        <div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;">
          ${getTiposPermiso().map(tp=>`<span style="display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--text-secondary);"><span style="width:8px;height:8px;border-radius:2px;background:${tp.color};display:inline-block;"></span>${esc(tp.nombre)}</span>`).join('')}
          <span style="display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--text-secondary);"><span style="width:8px;height:8px;border-radius:2px;background:#A2A3A6;display:inline-block;"></span>No laborable (según horario)</span>
          <span style="display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--text-secondary);"><span style="width:8px;height:8px;border-radius:2px;background:#C74A11;display:inline-block;"></span>☀ Jornada intensiva</span>
        </div>
      </div>
    </div>
  </div>`;
}

async function guardarFestivo(id){
  const nombre = document.getElementById('fe-nombre').value.trim();
  const fecha = document.getElementById('fe-fecha').value;
  const tipo = document.getElementById('fe-tipo').value || 'Nacional';
  if(!nombre || !fecha){ toast('Indica nombre y fecha', true); return; }
  if(id){ Object.assign(state.festivos.find(x=>x.id===id), {nombre, fecha, tipo}); }

}

async function eliminarFestivo(id){

  toast('Festivo eliminado');
  closeModal();

}
window.eliminarFestivo = eliminarFestivo;

/* ================= CALENDARIO DE PERSONAL (mes completo) ================= */
function cambiarVistaPersonal(vista){ state.personalCalVista = vista; render(); }
window.cambiarVistaPersonal = cambiarVistaPersonal;
function navegarCalendarioPersonal(delta){
  const ancla = state.calMesPersonal || todayISO();
  const vista = state.personalCalVista;
  if(vista==='semanal') state.calMesPersonal = addDiasISO(ancla, delta*7);
  else if(vista==='mensual') state.calMesPersonal = addMesesISO(ancla.slice(0,7), delta) + '-01';
  else if(vista==='trimestral') state.calMesPersonal = addMesesISO(ancla.slice(0,7), delta*3) + '-01';
  else state.calMesPersonal = (parseInt(ancla.slice(0,4),10)+delta)+ancla.slice(4);
  render();
}
window.navegarCalendarioPersonal = navegarCalendarioPersonal;
function diaCeldaPersonalHtml(fecha, enMes, compacto){
  const hoy = todayISO();
  const diaSemanaIdx = (new Date(fecha+'T00:00:00').getDay()+6)%7;
  const esFinde = diaSemanaIdx>=5;
  const festivo = state.festivos.find(f=>f.fecha===fecha);
  const claseFestivo = festivo? (festivo.tipo==='Local'?'festivo-local':'festivo-nacional') : '';
  const ausenciasDia = [];
  state.trabajadores.forEach(t=>{ const a = ausenciaEnFecha(t, fecha); if(a) ausenciasDia.push({trabajador:t, ausencia:a}); });
  const maxPills = compacto? 2 : 4;
  const pills = ausenciasDia.slice(0,maxPills).map(({trabajador,ausencia})=>{
    const c = colorPermiso(ausencia.tipo);
    return `<div class="cal-ev-pill" style="background:${hexToRgba(c,0.16)};color:${c};" onclick="event.stopPropagation(); editarTrabajador('${trabajador.id}')" title="${esc(trabajador.nombre)} — ${esc(ausencia.tipo)}">${esc(trabajador.nombre.split(' ')[0])}${compacto?'':' · '+esc(ausencia.tipo)}</div>`;
  });
  const restoOcultas = ausenciasDia.length>maxPills? ausenciasDia.length-maxPills : 0;
  const tituloCelda = festivo? `${festivo.tipo}: ${festivo.nombre}` : 'Pincha para registrar una ausencia';
  return `<div class="cal-day ${enMes?'':'out'} ${fecha===hoy?'today':''} ${esFinde?'weekend':''} ${claseFestivo}" onclick="abrirRegistrarAusencia('${fecha}')" title="${esc(tituloCelda)}">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;">
      <div class="cal-day-num">${parseInt(fecha.slice(8,10),10)}</div>
      ${festivo? `<span onclick="event.stopPropagation(); editarFestivo('${festivo.id}')" style="cursor:pointer;font-size:10px;">🎌</span>` : ''}
    </div>
    <div class="cal-day-evs">${pills.join('')}${restoOcultas? `<div class="muted" style="font-size:10px;">+${restoOcultas} más</div>`:''}</div>
  </div>`;
}
function semanasGridHtml(mesStr){
  const [anio, mesN] = mesStr.split('-').map(Number);
  const primerDia = mesStr+'-01';
  const diaSemanaPrimer = (new Date(primerDia+'T00:00:00').getDay()+6)%7;
  const inicioGrid = addDiasISO(primerDia, -diaSemanaPrimer);
  const diasEnMes = new Date(anio, mesN, 0).getDate();
  const totalCeldas = Math.ceil((diaSemanaPrimer+diasEnMes)/7)*7;
  let html = '';
  for(let w=0; w<totalCeldas/7; w++){
    const semanaInicio = addDiasISO(inicioGrid, w*7);
    html += `<div class="cal-week-num">${isoWeekNumber(semanaInicio)}</div>`;
    for(let d=0; d<7; d++){
      const fecha = addDiasISO(inicioGrid, w*7+d);
      html += diaCeldaPersonalHtml(fecha, fecha.slice(0,7)===mesStr, false);
    }
  }
  return html;
}
function miniMesHtml(mesStr){
  const [anio, mesN] = mesStr.split('-').map(Number);
  const primerDia = mesStr+'-01';
  const diaSemanaPrimer = (new Date(primerDia+'T00:00:00').getDay()+6)%7;
  const inicioGrid = addDiasISO(primerDia, -diaSemanaPrimer);
  const diasEnMes = new Date(anio, mesN, 0).getDate();
  const totalCeldas = Math.ceil((diaSemanaPrimer+diasEnMes)/7)*7;
  const mesesCortos = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const hoy = todayISO();
  let celdas='';
  for(let w=0; w<totalCeldas/7; w++){
    const semanaInicio = addDiasISO(inicioGrid, w*7);
    celdas += `<div style="display:flex;align-items:center;justify-content:center;font-size:8px;color:var(--text-faint);font-family:var(--num);">${isoWeekNumber(semanaInicio)}</div>`;
    for(let d=0; d<7; d++){
      const fecha = addDiasISO(inicioGrid, w*7+d);
      const enMes = fecha.slice(0,7)===mesStr;
      const esFinde = d>=5;
      const festivo = state.festivos.find(f=>f.fecha===fecha);
      const ausenciasDia = state.trabajadores.map(t=>{ const a=ausenciaEnFecha(t,fecha); return a? {t,a} : null; }).filter(Boolean);
      const claseFestivo = festivo? (festivo.tipo==='Local'?'festivo-local':'festivo-nacional') : '';
      let estiloFondo = '', tituloCelda = festivo? (festivo.tipo+': '+festivo.nombre) : (esFinde?'Fin de semana':'');
      if(!festivo && esFinde) estiloFondo = 'background:var(--surface-3);';
      if(!festivo && ausenciasDia.length){
        const color = colorPermiso(ausenciasDia[0].a.tipo);
        estiloFondo = `background:${hexToRgba(color,0.32)};box-shadow:inset 0 0 0 1.5px ${color};`;
        tituloCelda = ausenciasDia.map(x=>x.t.nombre+' ('+x.a.tipo+')').join(', ');
      }
      const badge = ausenciasDia.length>1? `<span style="position:absolute;top:-3px;right:-3px;background:var(--danger);color:#fff;border-radius:50%;width:11px;height:11px;font-size:7px;line-height:11px;text-align:center;font-weight:700;">${ausenciasDia.length}</span>` : '';
      celdas += `<div class="${claseFestivo}" onclick="abrirRegistrarAusencia('${fecha}')" title="${esc(tituloCelda)}" style="position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:${ausenciasDia.length?'700':'400'};border-radius:4px;cursor:pointer;${estiloFondo}${enMes?'':'opacity:.35;'}${fecha===hoy?'box-shadow:inset 0 0 0 1.5px var(--accent);':''}">${parseInt(fecha.slice(8,10),10)}${badge}</div>`;
    }
  }
  return `<div style="min-width:160px;flex:1 1 160px;">
    <div style="text-align:center;font-size:11.5px;font-weight:700;margin-bottom:6px;">${mesesCortos[mesN-1]} ${anio}</div>
    <div style="display:grid;grid-template-columns:16px repeat(7,1fr);gap:2px;">${celdas}</div>
  </div>`;
}

function calcularNecesidadesMaterial(presupuesto){
  const mapa = {};
  (presupuesto.partidas||[]).forEach(p=>{
    const modoCompleta = p.sistema && p.sistema.modo==='completa';
    ((p.sistema&&p.sistema.items)||[]).forEach(it=>{
      const cantidadReal = modoCompleta? (it.cantidad||0) : (it.cantidad||0)*(p.cantidad||0);
      const key = it.tipo==='texto' ? ('texto:'+it.rid) : it.articuloId;
      const art = it.tipo!=='texto' ? state.catalogo.find(a=>a.id===it.articuloId) : null;
      const desc = it.descripcion || (art? descripcionAuto(art) : 'Línea manual');
      const unidad = art? (esPerfil(art)?'ml':'ud') : '';
      if(!mapa[key]) mapa[key] = {descripcion:desc, cantidad:0, unidad, articuloId: it.tipo!=='texto'?it.articuloId:null, partidas:[]};
      mapa[key].cantidad += cantidadReal;
      const nombrePartida = p.nombre||'Partida';
      if(!mapa[key].partidas.includes(nombrePartida)) mapa[key].partidas.push(nombrePartida);
    });
  });
  return Object.values(mapa);
}

function renderPlanningObra(o){
  const planning = getPlanningObra(o);
  const tareas = planning.tareas || [];
  const inicioBase = mondayOf(planning.fechaInicio);
  let numSemanas = 6;
  tareas.forEach(t=>{
    const offset = Math.round((new Date(t.fechaInicio+'T00:00:00') - new Date(inicioBase+'T00:00:00'))/(7*86400000));
    const fin = offset + (t.duracionSemanas||1);
    if(fin>numSemanas) numSemanas = fin;
  });
  numSemanas += 1;
  const hoy = todayISO();
  const offsetHoy = Math.round((new Date(hoy+'T00:00:00') - new Date(inicioBase+'T00:00:00'))/(7*86400000));

  const semanasHeader = [...Array(numSemanas)].map((_,i)=>{
    const fechaSemana = addDiasISO(inicioBase, i*7);
    return `<div style="text-align:center;font-size:9px;color:var(--text-faint);border-left:1px solid var(--border);padding:3px 1px;">S${isoWeekNumber(fechaSemana)}<br><span style="font-size:8px;">${fechaSemana.slice(8,10)}/${fechaSemana.slice(5,7)}</span></div>`;
  }).join('');

  const filas = tareas.map(t=>{
    const offset = Math.round((new Date(t.fechaInicio+'T00:00:00') - new Date(inicioBase+'T00:00:00'))/(7*86400000));
    const dur = t.duracionSemanas||1;
    return `<div class="planning-row">
      <div class="planning-label" style="justify-content:space-between;">
        <div style="display:flex;align-items:center;gap:6px;min-width:0;cursor:pointer;flex:1;" onclick="editarTareaPlanning('${o.id}','${t.id}')">
          <span style="width:8px;height:8px;border-radius:2px;background:${t.color};flex:0 0 auto;"></span>
          <div style="min-width:0;"><div style="font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(t.nombre)}</div><div class="muted" style="font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(t.cuadrilla||'Sin cuadrilla')}</div></div>
        </div>
        <button class="icon-btn no-print" style="flex:0 0 auto;padding:3px;" onclick="event.stopPropagation(); eliminarTareaPlanning('${o.id}','${t.id}')" title="Eliminar tarea">${ICON_TRASH}</button>
      </div>
      <div class="planning-timeline" style="grid-template-columns:repeat(${numSemanas},1fr);">
        ${offsetHoy>=0&&offsetHoy<numSemanas? `<div style="grid-column:${offsetHoy+1};grid-row:1;border-left:1.5px dashed var(--accent);height:100%;justify-self:start;"></div>` : ''}
        <div onclick="editarTareaPlanning('${o.id}','${t.id}')" title="${esc(t.nombre)} — ${esc(t.cuadrilla||'Sin cuadrilla')} — desde ${fmtFecha(t.fechaInicio)}, ${dur} semana(s)" style="grid-column:${Math.max(1,offset+1)} / span ${dur};grid-row:1;align-self:center;height:22px;border-radius:5px;background:${t.color};cursor:pointer;display:flex;align-items:center;padding:0 6px;overflow:hidden;">
          <span style="color:#fff;font-size:10px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(t.nombre)}</span>
        </div>
      </div>
    </div>`;
  }).join('');

  const cuadrillas = [...new Set(tareas.map(t=>t.cuadrilla).filter(Boolean))];

  return `<div class="card" style="margin-top:18px;">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
      <h3 style="border:none;padding:0;margin:0;">Planning de obra</h3>
      <div class="no-print" style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn btn-sm" onclick="abrirFechaBasePlanning('${o.id}')">${ICON_EDIT}Fecha de inicio</button>
        <button class="btn btn-sm" onclick="abrirNuevaTareaPlanning('${o.id}')">${ICON_PLUS}Nueva tarea</button>
        <button class="btn btn-primary btn-sm" onclick="exportarPlanningPDF('${o.id}')">${ICON_FILE}Descargar PDF</button>
      </div>
    </div>
    <div class="hint" style="margin:8px 0 4px;">Organiza el planning por cuadrillas y semanas: replanteo, escuadras y perfilería, revestimiento… Pincha una barra para editarla. La línea de puntos marca la semana actual.</div>
    ${tareas.length? `<div style="overflow-x:auto;margin-top:10px;">
      <div style="min-width:${170+numSemanas*34}px;">
        <div class="planning-row">
          <div class="planning-label" style="font-size:10px;font-weight:700;text-transform:uppercase;color:var(--text-faint);cursor:default;">Tarea</div>
          <div class="planning-timeline" style="grid-template-columns:repeat(${numSemanas},1fr);">${semanasHeader}</div>
        </div>
        ${filas}
      </div>
    </div>
    ${cuadrillas.length? `<div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;">${cuadrillas.map(cu=>{ const t0=tareas.find(t=>t.cuadrilla===cu); return `<span style="display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-secondary);"><span style="width:9px;height:9px;border-radius:2px;background:${t0.color};display:inline-block;"></span>${esc(cu)}</span>`; }).join('')}</div>` : ''}
    ` : `<div class="empty" style="margin-top:10px;">${ICON_EMPTY}<div>Sin tareas en el planning todavía. Empieza añadiendo "Replanteo" con su fecha de inicio.</div></div>`}
  </div>`;
}
async function exportarPlanningPDF(obraId){
  const o = state.obras.find(x=>x.id===obraId); if(!o) return;
  const planning = getPlanningObra(o);
  const tareas = (planning.tareas||[]).slice().sort((a,b)=>a.fechaInicio.localeCompare(b.fechaInicio));
  if(!tareas.length){ toast('Añade al menos una tarea al planning antes de exportarlo', true); return; }
  toast('Generando PDF del planning…');
  try{ await esperarLibreriaPDF(); }
  catch(e){ toast('No se pudo cargar el generador de PDF (revisa la conexión a internet)', true); return; }

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'mm', format:'a4', orientation:'landscape'});
  const marginX = 16;
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();
  const cliente = state.clientes.find(c=>c.id===o.clienteId);
  const accent = [173,122,44];

  doc.setFont('helvetica','bold'); doc.setFontSize(16); doc.setTextColor(30);
  doc.text('Planning de obra', marginX, 18);
  doc.setFont('helvetica','normal'); doc.setFontSize(10.5); doc.setTextColor(90);
  doc.text(o.nombre + (cliente? '  ·  '+cliente.nombre : ''), marginX, 25);
  doc.setFontSize(9);
  doc.text('Inicio del planning: '+fmtFecha(planning.fechaInicio), marginX, 31);

  const inicioBase = mondayOf(planning.fechaInicio);
  let numSemanas = 6;
  tareas.forEach(t=>{
    const offset = Math.round((new Date(t.fechaInicio+'T00:00:00') - new Date(inicioBase+'T00:00:00'))/(7*86400000));
    const fin = offset + (t.duracionSemanas||1);
    if(fin>numSemanas) numSemanas = fin;
  });
  numSemanas += 1;

  const chartX = marginX + 46, chartY = 40, rowH = 8;
  const chartW = pageW - marginX - chartX;
  const colW = chartW / numSemanas;
  doc.setFontSize(7); doc.setTextColor(140);
  for(let i=0;i<numSemanas;i++){
    const fechaSemana = addDiasISO(inicioBase, i*7);
    doc.text('S'+isoWeekNumber(fechaSemana), chartX + i*colW + colW/2, chartY-3, {align:'center'});
    doc.setDrawColor(230); doc.line(chartX+i*colW, chartY-1, chartX+i*colW, chartY + tareas.length*rowH + 1);
  }
  doc.setFontSize(8.5);
  tareas.forEach((t,i)=>{
    const y = chartY + i*rowH;
    doc.setTextColor(30);
    const nombreCorto = t.nombre.length>26? t.nombre.slice(0,24)+'…' : t.nombre;
    doc.text(nombreCorto, marginX, y+5);
    if(t.cuadrilla){ doc.setFontSize(6.5); doc.setTextColor(140); doc.text(t.cuadrilla, marginX, y+7.6); doc.setFontSize(8.5); }
    const offset = Math.max(0, Math.round((new Date(t.fechaInicio+'T00:00:00') - new Date(inicioBase+'T00:00:00'))/(7*86400000)));
    const dur = t.duracionSemanas||1;
    const hexColor = (t.color||'#C74A11').replace('#','');
    const r = parseInt(hexColor.slice(0,2),16), g = parseInt(hexColor.slice(2,4),16), b = parseInt(hexColor.slice(4,6),16);
    doc.setFillColor(r,g,b);
    doc.roundedRect(chartX + offset*colW + 1, y+1, Math.max(colW*dur-2,2), rowH-3, 1, 1, 'F');
  });
  doc.setDrawColor(220);
  doc.rect(chartX, chartY-1, chartW, tareas.length*rowH+1);

  doc.setFontSize(8); doc.setTextColor(150);
  doc.text('Generado el '+fmtFecha(todayISO())+' — Gestión NS · Fachadas Ventiladas', marginX, pageH-8);

  const nombreArchivo = 'Planning_'+(o.nombre||'obra').replace(/[^A-Za-z0-9]+/g,'_')+'.pdf';
  doc.save(nombreArchivo);
  toast('PDF descargado');
}
window.exportarPlanningPDF = exportarPlanningPDF;

function buscarCiudadLocal(direccion){
  const norm = direccion.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const entradas = Object.entries(CIUDADES_ES).sort((a,b)=>b[0].length-a[0].length); // ciudades más largas primero (ej. "san sebastian" antes que perder con coincidencias parciales)
  for(const [ciudad, coords] of entradas){
    const ciudadNorm = ciudad.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    if(new RegExp('(^|[^a-z])'+ciudadNorm+'([^a-z]|$)').test(norm)){
      return {lat:coords[0], lng:coords[1], nombre:ciudad.charAt(0).toUpperCase()+ciudad.slice(1)+' (aproximado, centro de la ciudad)', aproximado:true};
    }
  }
  return null;
}
async function geocodificarDireccion(direccion){
  let fetchError = null;
  try{
    let q = direccion.trim();
    if(!/espa[ñn]a|spain/i.test(q)) q += ', España';
    const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=es&accept-language=es&q='+encodeURIComponent(q);
    const res = await fetch(url, {headers:{'Accept':'application/json'}});
    if(res.ok){
      const data = await res.json();
      if(data && data[0]) return {lat:parseFloat(data[0].lat), lng:parseFloat(data[0].lon), nombre:data[0].display_name};
    }
  }catch(e){ fetchError = e; }
  // Si el servicio externo no responde (p.ej. red bloqueada en esta vista previa) o no hay resultado,
  // probamos con un listado local de ciudades españolas antes de rendirnos.
  const local = buscarCiudadLocal(direccion);
  if(local){ local.avisoRed = !!fetchError; return local; }
  return null;
}
async function geocodificarObra(id){
  const o = state.obras.find(x=>x.id===id); if(!o || !o.direccion) { toast('Añade una dirección primero', true); return; }
  toast('Buscando ubicación…');
  const coords = await geocodificarDireccion(o.direccion);
  if(!coords){ toast('No se ha encontrado esa dirección ni ninguna ciudad reconocible en el texto. Prueba escribiendo el nombre de la ciudad más claro, o indica las coordenadas a mano en la ficha de la obra.', true); return; }
  o.lat = coords.lat; o.lng = coords.lng; o.ubicacionNombre = coords.nombre;
  await persist('obras');
  toast('Ubicación encontrada: '+coords.nombre.split(',').slice(0,3).join(','));
  render();
}
window.geocodificarObra = geocodificarObra;
async function geocodificarPresupuesto(id){
  const p = state.presupuestos.find(x=>x.id===id); if(!p) return;
  const cliente = state.clientes.find(c=>c.id===p.clienteId);
  const direccion = cliente && cliente.direccion;
  if(!direccion){ toast('El cliente de este presupuesto no tiene dirección', true); return; }
  toast('Buscando ubicación…');
  const coords = await geocodificarDireccion(direccion);
  if(!coords){ toast('No se pudo localizar esa dirección', true); return; }
  p.lat = coords.lat; p.lng = coords.lng;
  await persist('presupuestos');
  toast('Ubicación encontrada');
  render();
}

function cerrarMenuMapaFuera(ev){
  const menu = document.getElementById('menu-mapa');
  if(menu && !menu.contains(ev.target)) menu.style.display='none';
}
function toggleMenuMapa(){
  const menu = document.getElementById('menu-mapa');
  if(!menu) return;
  const abrir = menu.style.display==='none';
  menu.style.display = abrir? 'block' : 'none';
  if(abrir) setTimeout(()=>document.addEventListener('click', cerrarMenuMapaFuera, {once:true}), 0);
}
window.toggleMenuMapa = toggleMenuMapa;
function renderLeafletMap(){
  const el = document.getElementById('leaflet-map');
  if(!el) return;
  if(typeof L==='undefined'){
    el.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100%;text-align:center;padding:16px;color:var(--text-secondary);font-size:12.5px;">
      No se pudo cargar la librería del mapa (Leaflet) desde internet.<br>Comprueba tu conexión y pulsa reintentar.
      <br><button class="btn btn-sm" style="margin-top:8px;" onclick="renderLeafletMap()">Reintentar</button>
    </div>`;
    return;
  }
  if(__leafletMap){ __leafletMap.remove(); __leafletMap=null; __capaObras=null; __capaPresupuestos=null; }
  el.innerHTML = '';
  const todasCoords = [...state.obras.filter(o=>o.lat), ...state.presupuestos.filter(p=>p.lat && !state.obras.some(o=>o.presupuestoId===p.id))];
  const centro = todasCoords.length? [todasCoords[0].lat, todasCoords[0].lng] : [40.4168,-3.7038];
  __leafletMap = L.map('leaflet-map').setView(centro, todasCoords.length? 7 : 5);
  const est = MAPA_ESTILOS[state.mapaEstilo||'osm'];
  const capaTeselas = L.tileLayer(est.url, {attribution:est.attr, subdomains:est.subdominios||'abc', maxZoom: state.mapaEstilo==='topo'?17:19}).addTo(__leafletMap);
  let erroresTesela = 0;
  capaTeselas.on('tileerror', ()=>{
    erroresTesela++;
    if(erroresTesela===6){ toast('Algunas teselas del mapa no han cargado (posible bloqueo de red a tile servers externos).', true); }
  });
  __capaObras = L.layerGroup().addTo(__leafletMap);
  __capaPresupuestos = L.layerGroup().addTo(__leafletMap);
  actualizarMarcadoresMapa();
  setTimeout(()=>{ if(__leafletMap) __leafletMap.invalidateSize(); }, 120);
}
function actualizarMarcadoresMapa(){
  if(!__leafletMap || !__capaObras || !__capaPresupuestos) return;
  __capaObras.clearLayers();
  __capaPresupuestos.clearLayers();
  const f = state.mapaFiltro;
  const obras = f.obras? state.obras.filter(o=>o.lat) : [];
  const pres = f.presupuestos? state.presupuestos.filter(p=>p.lat && !state.obras.some(o=>o.presupuestoId===p.id)) : [];
  obras.forEach(o=>{
    const color = ESTADO_OBRA_COLOR[o.estadoObra]||'#6B6C70';
    const m = L.circleMarker([o.lat,o.lng], {radius:9, color, fillColor:color, fillOpacity:0.85, weight:2, className:'marcador-clicable'});
    m.bindTooltip(`${o.nombre} · ${o.estadoObra}`, {direction:'top'});
    m.on('click', ()=>abrirFichaObra(o.id));
    __capaObras.addLayer(m);
  });
  pres.forEach(p=>{
    const color = ESTADO_COLOR[p.estado]||'#8A8D91';
    const m = L.circleMarker([p.lat,p.lng], {radius:7, color, fillColor:color, fillOpacity:0.7, weight:2, className:'marcador-clicable'});
    m.bindTooltip(`${p.proyecto} · ${ESTADO_LABEL[p.estado]||p.estado}`, {direction:'top'});
    m.on('click', ()=>openBuilder(p.id));
    __capaPresupuestos.addLayer(m);
  });
  const puntos = [...obras, ...pres];
  if(puntos.length>1){ __leafletMap.fitBounds(puntos.map(pt=>[pt.lat,pt.lng]), {padding:[30,30]}); }
  else if(puntos.length===1){ __leafletMap.setView([puntos[0].lat,puntos[0].lng], 12); }
}

function renderPlanningResumenWidget(compacto){
  const hoy = todayISO();
  const activas = state.obras.filter(o=>o.estadoObra!=='Finalizada');
  const filas = activas.map((o,i)=>{
    const planning = getPlanningObra(o);
    const tareas = planning.tareas||[];
    if(!tareas.length) return null;
    const inicio = tareas.reduce((min,t)=>t.fechaInicio<min?t.fechaInicio:min, tareas[0].fechaInicio);
    const fin = tareas.reduce((max,t)=>{ const f=addDiasISO(t.fechaInicio,(t.duracionSemanas||1)*7-1); return f>max?f:max; }, addDiasISO(tareas[0].fechaInicio,(tareas[0].duracionSemanas||1)*7-1));
    return {o, inicio, fin, color: CHART_COLORS[i % CHART_COLORS.length]};
  }).filter(Boolean).sort((a,b)=>a.inicio.localeCompare(b.inicio));

  if(!filas.length){
    return `<div class="card" style="${compacto?'flex:1;display:flex;flex-direction:column;min-height:0;width:100%;':''}">
      <h3 style="flex:0 0 auto;">Planning de obras</h3>
      <div class="empty" style="padding:16px;">${ICON_EMPTY}<div>Sin planning programado todavía. Añádelo desde la ficha de cada obra.</div></div>
    </div>`;
  }

  let globalInicio = filas.reduce((min,f)=>f.inicio<min?f.inicio:min, filas[0].inicio);
  let globalFin = filas.reduce((max,f)=>f.fin>max?f.fin:max, filas[0].fin);
  // margen de una semana a cada lado para que las barras no queden pegadas al borde
  globalInicio = addDiasISO(globalInicio, -4);
  globalFin = addDiasISO(globalFin, 4);
  const totalDias = Math.max(1, (new Date(globalFin+'T00:00:00') - new Date(globalInicio+'T00:00:00'))/86400000);
  const pctDeFecha = (f)=> Math.min(100, Math.max(0, (new Date(f+'T00:00:00') - new Date(globalInicio+'T00:00:00'))/86400000/totalDias*100));
  const hoyPct = pctDeFecha(hoy);

  const mesesCortos = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  const meses = [];
  let cursorMes = globalInicio.slice(0,7)+'-01';
  while(cursorMes <= globalFin){
    meses.push(cursorMes);
    cursorMes = addMesesISO(cursorMes.slice(0,7), 1)+'-01';
  }
  const mesesHtml = meses.map(m=>{
    const pct = pctDeFecha(m);
    const [anio, mesN] = m.slice(0,7).split('-').map(Number);
    return `<div style="position:absolute;left:${pct}%;top:0;bottom:0;border-left:1px solid var(--border);"></div>
      <div style="position:absolute;left:${pct}%;top:0;font-size:9px;color:var(--text-faint);padding-left:3px;white-space:nowrap;">${mesesCortos[mesN-1]}${compacto?'':' '+anio}</div>`;
  }).join('');

  const filasHtml = filas.map(f=>{
    const startPct = pctDeFecha(f.inicio);
    const widthPct = Math.max(2.5, pctDeFecha(f.fin)-startPct);
    return `<div style="position:relative;height:${compacto?'22px':'26px'};margin-bottom:4px;">
      <div onclick="abrirFichaObra('${f.o.id}')" title="${esc(f.o.nombre)}: ${fmtFecha(f.inicio)} → ${fmtFecha(f.fin)}" style="position:absolute;left:${startPct}%;width:${widthPct}%;height:16px;top:3px;background:${f.color};border-radius:4px;cursor:pointer;display:flex;align-items:center;overflow:hidden;">
        <span style="color:#fff;font-size:10px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px;">${esc(f.o.nombre)}</span>
      </div>
    </div>`;
  }).join('');

  return `<div class="card" style="${compacto?'flex:1;display:flex;flex-direction:column;min-height:0;width:100%;':''}">
    <h3 style="flex:0 0 auto;">Planning de obras</h3>
    <div style="${compacto?'overflow:auto;min-height:0;':''}">
      <div style="position:relative;padding-top:16px;">
        ${mesesHtml}
        ${(hoyPct>=0 && hoyPct<=100)? `<div style="position:absolute;left:${hoyPct}%;top:16px;bottom:0;width:0;border-left:1.5px dashed var(--accent);z-index:1;"></div>` : ''}
        ${filasHtml}
      </div>
    </div>
  </div>`;
}

function calcPartida(p, mesRef, overrideBaseKg){
  const sis = p.sistema || {beneficioPct:0, modo:'representativa', items:[]};
  const modoCompleta = sis.modo==='completa';
  const cantidadSistemaPrevia = (sis.cantidad!=null && sis.cantidad!=='') ? (parseFloat(sis.cantidad)||0) : (p.cantidad||0);
  const items = (sis.items||[]).map(it=>{
    const art = it.tipo==='texto' ? null : state.catalogo.find(a=>a.id===it.articuloId);
    const puCatalogo = it.tipo==='texto' ? (it.precioUnitario||0) : precioEfectivoArticulo(art, mesRef, overrideBaseKg);
    const pu = (it.precioCosteManual!=null && it.precioCosteManual!=='') ? (parseFloat(it.precioCosteManual)||0) : puCatalogo;
    const desp = it.desperdicioPct||0;
    const margen = it.margenPct||0;
    const ventaUnitaria = pu!==null? pu*(1+margen/100) : null;
    const base = (pu!==null? pu*(it.cantidad||0)*(1+desp/100) : 0);
    const costeUnidad = base*(1+margen/100);
    const cantidadRepercutida = cantidadSistemaPrevia? (it.cantidad||0)/cantidadSistemaPrevia : 0;
    return {...it, art, pu, puCatalogo, ventaUnitaria, costeTotalSinMargen: base, costeUnidad, cantidadRepercutida};
  });
  const cantidad = p.cantidad||0;
  const cantidadSistema = cantidadSistemaPrevia;
  const costeMaterialPorUnidad = items.reduce((s,i)=>s+i.costeUnidad,0);
  const costeSistemaSinMargenPorUnidad = items.reduce((s,i)=>s+i.costeTotalSinMargen,0);
  const costeMaterialTotal = modoCompleta ? costeMaterialPorUnidad : costeMaterialPorUnidad * cantidadSistema;
  const beneficioImporte = costeMaterialTotal * ((sis.beneficioPct||0)/100);
  const sistemaTotal = costeMaterialTotal + beneficioImporte;

  const mo = p.manoObra || {modo:'porUnidad', importe:0};
  const manoObraTotal = mo.modo==='fijo'? (mo.importe||0) : (mo.importe||0)*cantidad;
  const rv = p.revestimiento || {modo:'porUnidad', importe:0, descripcion:'', desperdicioPct:0, margenPct:0};
  const revestimientoBase = rv.modo==='fijo'? (rv.importe||0) : (rv.importe||0)*cantidad;
  const revestimientoTotal = revestimientoBase * (1+((rv.desperdicioPct||0)/100)) * (1+((rv.margenPct||0)/100));
  const pt = p.portes || {modo:'fijo', importe:0, beneficioPct:0};
  const cantidadPortes = (pt.cantidad!=null && pt.cantidad!=='') ? (parseFloat(pt.cantidad)||0) : cantidad;
  const portesBase = pt.modo==='fijo'? (pt.importe||0) : (pt.importe||0)*cantidadPortes;
  const portesTotal = portesBase * (1+((pt.beneficioPct||0)/100));
  const lineasCustom = (p.lineasCustom||[]).map(c=>{
    const cantidadCustom = (c.cantidad!=null && c.cantidad!=='') ? (parseFloat(c.cantidad)||0) : cantidad;
    const base = c.modo==='fijo'? (c.importe||0) : (c.importe||0)*cantidadCustom;
    const total = base*(1+((c.beneficioPct||0)/100));
    return {...c, total};
  });
  const customTotal = lineasCustom.reduce((s,c)=>s+c.total,0);

  const totalPartida = sistemaTotal + manoObraTotal + revestimientoTotal + portesTotal + customTotal;
  const repercusion = cantidad? totalPartida/cantidad : 0;
  return {items, modoCompleta, cantidadSistema, costeMaterialPorUnidad, costeSistemaSinMargenPorUnidad, costeMaterialTotal, beneficioImporte, sistemaTotal, manoObraTotal, revestimientoTotal, portesTotal, lineasCustom, customTotal, totalPartida, repercusion};
}
function calcBuilderTotales(b){
  const partidas = (b.partidas||[]).map(p=>({...p, calc: calcPartida(p, b.mesRef, b.precioAluminioOverride)}));
  const sistemaTotal = partidas.reduce((s,p)=>s+p.calc.sistemaTotal,0);
  const manoObraTotal = partidas.reduce((s,p)=>s+p.calc.manoObraTotal,0);
  const revestimientoTotal = partidas.reduce((s,p)=>s+p.calc.revestimientoTotal,0);
  const portesTotal = partidas.reduce((s,p)=>s+p.calc.portesTotal,0);
  const customTotal = partidas.reduce((s,p)=>s+p.calc.customTotal,0);
  const subtotalPartidas = partidas.reduce((s,p)=>s+p.calc.totalPartida,0);
  const otros = b.otros||0;
  const subtotal = subtotalPartidas + otros;
  const margenImporte = subtotal * ((b.margen||0)/100);
  const base = subtotal + margenImporte;
  const ivaImporte = base * ((b.iva||0)/100);
  const total = base + ivaImporte;
  const sistemaM2 = (b.m2||0)? sistemaTotal/(b.m2||1) : 0;
  const m2Total = calcSuperficieTotal(b);
  return {partidas, sistemaM2, m2Total, sistemaTotal, manoObraTotal, revestimientoTotal, portesTotal, customTotal, subtotalPartidas, otros, subtotal, margenImporte, base, ivaImporte, total};
}
function totalPresupuesto(p){ return p.snapshot? p.snapshot.total : calcBuilderTotales(p).total; }

function diasDesde(iso){
  if(!iso) return 0;
  const ms = new Date(todayISO()+'T00:00:00') - new Date(iso+'T00:00:00');
  return Math.max(0, Math.round(ms/86400000));

function descripcionAutoPartida(p){
  const tieneManoObra = !(p.lineasOcultas||[]).includes('manoObra');
  const rv = p.revestimiento || {};
  const sis = p.sistema || {};
  let base = 'Suministro' + (tieneManoObra? ' y colocación' : '') + ' de fachada ventilada';
  const tipoYProveedor = [rv.tipoRevestimiento, rv.proveedor].filter(Boolean).join(' ');
  if(tipoYProveedor) base += ' de ' + tipoYProveedor;
  const piezas = [base];
  if(rv.modelo) piezas.push('modelo ' + rv.modelo);
  if(rv.formato) piezas.push('en formato ' + rv.formato);
  if(rv.orientacion) piezas.push('colocado en ' + rv.orientacion.toLowerCase());
  let fraseSistema = 'instalado mediante sistema' + (sis.tipoSistema? ' ' + sis.tipoSistema : '');
  const materiales = (sis.items||[]).map(it=>it.descripcion).filter(Boolean);
  if(materiales.length) fraseSistema += ' consistente en ' + materiales.join(', ');
  piezas.push(fraseSistema);
  return piezas.join(', ') + '.';
}

function migrarPartidaCampos(p){

    p.sistema.modo = p.sistema.modo || 'representativa';
  }
  p.sistema.items.forEach(it=>{
    if(it.margenPct===undefined) it.margenPct = 0;
    if(it.descripcion===undefined){
      const art = it.tipo!=='texto' ? state.catalogo.find(a=>a.id===it.articuloId) : null;

  if(!p.revestimiento || p.revestimiento.activo!==undefined) p.revestimiento = {modo:(p.revestimiento&&p.revestimiento.modo)||'porUnidad', importe:(p.revestimiento&&p.revestimiento.activo)? (p.revestimiento.importe||0) : (p.revestimiento&&p.revestimiento.importe)||0, descripcion:(p.revestimiento&&p.revestimiento.descripcion)||'', desperdicioPct:(p.revestimiento&&p.revestimiento.desperdicioPct)||0};
  if(p.revestimiento.descripcion===undefined) p.revestimiento.descripcion = '';
  if(p.revestimiento.desperdicioPct===undefined) p.revestimiento.desperdicioPct = 0;
  if(!p.portes){
    const portesExtra = (p.extras||[]).find(e=>(e.nombre||'').toLowerCase()==='portes');
    p.portes = portesExtra? {modo:portesExtra.modo||'fijo', importe:portesExtra.importe||0} : {modo:'fijo', importe:0};
  }
  if(!p.lineasOcultas) p.lineasOcultas = [];
  if(!p.lineasCustom){
    p.lineasCustom = (p.extras||[]).filter(e=>(e.nombre||'').toLowerCase()!=='portes').map(e=>({id:e.id||uid(), nombre:e.nombre||'Otro concepto', modo:e.modo||'fijo', importe:e.importe||0}));
  }
  delete p.extras;
  return p;
}

  }
  await persist('presupuestos');
  toast('Presupuesto marcado como enviado');

async function guardarEditarItemSistema(){
  const extra = state.modal.extra || {};
  const p = findPartida(extra.partidaId); if(!p){ closeModal(); return; }
  const it = p.sistema.items.find(i=>i.rid===extra.rid); if(!it){ closeModal(); return; }
  it.descripcion = document.getElementById('eis-descripcion').value;
  it.cantidad = parseFloat(document.getElementById('eis-cantidad').value)||0;
  it.desperdicioPct = parseFloat(document.getElementById('eis-desperdicio').value)||0;
  it.margenPct = parseFloat(document.getElementById('eis-margen').value)||0;
  const precioVal = parseFloat(document.getElementById('eis-precio').value)||0;
  if(it.tipo==='texto'){
    it.precioUnitario = precioVal;
  } else {
    const art = state.catalogo.find(a=>a.id===it.articuloId);
    const precioCatalogo = art? precioEfectivoArticulo(art, state.builder.mesRef, state.builder.precioAluminioOverride) : null;
    it.precioCosteManual = (precioCatalogo!=null && Math.abs(precioVal-precioCatalogo)<0.0005) ? null : precioVal;
  }
  closeModal();
  toast('Artículo actualizado');
  render();
}

function crearPresupuestoDesdePlantilla(plantillaId){
  const pl = state.plantillasPresupuesto.find(x=>x.id===plantillaId); if(!pl) return;
  openBuilder(null);
  const mapaCapId = {};
  const capitulosOrig = (pl.capitulos&&pl.capitulos.length)? pl.capitulos : [{id:'__legacy__', nombre:'Capítulo 1'}];
  state.builder.capitulos = capitulosOrig.map(c=>{
    const nuevoId = uid();
    mapaCapId[c.id] = nuevoId;
    return {id:nuevoId, nombre:c.nombre};
  });
  state.builder.partidas = JSON.parse(JSON.stringify(pl.partidas)).map(p=>{
    p.id = uid();
    p.capituloId = mapaCapId[p.capituloId] || state.builder.capitulos[0].id;
    if(p.sistema && p.sistema.items) p.sistema.items = p.sistema.items.map(it=>({...it, rid:uid()}));
    (p.lineasCustom||[]).forEach(c=>{ c.id = uid(); });
    return p;
  });
  closeModal();
  toast('Presupuesto creado desde la plantilla "'+pl.nombre+'"');
  render();
}

async function savePresupuesto(){
  const b = state.builder;
  if(!b.clienteId){ toast('Selecciona un cliente', true); bsetStep(1); return; }
  if(!b.proyecto.trim()){ toast('Indica el nombre del proyecto', true); bsetStep(1); return; }

  const clean = {...b, partidas: b.partidas.map(p=>({
    id:p.id, nombre:p.nombre, descripcion:p.descripcion||'', descripcionManual:(p.descripcionManual!=null && p.descripcionManual!=='')?p.descripcionManual:null, cantidad:p.cantidad, unidad:p.unidad, capituloId:p.capituloId,
    sistema: {
      beneficioPct: p.sistema.beneficioPct||0,
      modo: p.sistema.modo||'representativa',
      cantidad: (p.sistema.cantidad!=null && p.sistema.cantidad!=='') ? p.sistema.cantidad : null,
      tipoSistema: p.sistema.tipoSistema||'',
      items: p.sistema.items.map(it=> it.tipo==='texto'
        ? {rid:it.rid, tipo:'texto', descripcion:it.descripcion||'', cantidad:it.cantidad, desperdicioPct:it.desperdicioPct||0, margenPct:it.margenPct||0, precioUnitario:it.precioUnitario||0}
        : {rid:it.rid, tipo:'articulo', articuloId:it.articuloId, descripcion:it.descripcion||'', cantidad:it.cantidad, desperdicioPct:it.desperdicioPct||0, margenPct:it.margenPct||0, precioCosteManual:(it.precioCosteManual!=null && it.precioCosteManual!=='')?it.precioCosteManual:null})
    },
    manoObra: {modo:(p.manoObra&&p.manoObra.modo)||'porUnidad', importe:(p.manoObra&&p.manoObra.importe)||0},
    revestimiento: {
      modo:(p.revestimiento&&p.revestimiento.modo)||'porUnidad', importe:(p.revestimiento&&p.revestimiento.importe)||0,
      descripcion:(p.revestimiento&&p.revestimiento.descripcion)||'', tipoRevestimiento:(p.revestimiento&&p.revestimiento.tipoRevestimiento)||'', formato:(p.revestimiento&&p.revestimiento.formato)||'',
      modelo:(p.revestimiento&&p.revestimiento.modelo)||'', proveedor:(p.revestimiento&&p.revestimiento.proveedor)||'',
      orientacion:(p.revestimiento&&p.revestimiento.orientacion)||'', personaContacto:(p.revestimiento&&p.revestimiento.personaContacto)||'',
      margenPct:(p.revestimiento&&p.revestimiento.margenPct)||0, desperdicioPct:(p.revestimiento&&p.revestimiento.desperdicioPct)||0,
    },
    portes: {modo:(p.portes&&p.portes.modo)||'fijo', importe:(p.portes&&p.portes.importe)||0, cantidad:(p.portes&&p.portes.cantidad!=null && p.portes.cantidad!=='')?p.portes.cantidad:null, beneficioPct:(p.portes&&p.portes.beneficioPct)||0},
    lineasOcultas: (p.lineasOcultas||[]).slice(),
    lineasCustom: (p.lineasCustom||[]).map(({id,nombre,modo,importe,cantidad,beneficioPct})=>({id,nombre,modo,importe:importe||0,cantidad:(cantidad!=null&&cantidad!=='')?cantidad:null,beneficioPct:beneficioPct||0})),
  })), capitulos: (b.capitulos||[]).map(c=>({id:c.id, nombre:c.nombre}))};
  delete clean.step;
  clean.grupoId = clean.grupoId || uid();
  clean.version = clean.version || 1;
  clean.variante = clean.variante || 'Principal';
  clean.estado = clean.estado || 'borrador';

  if(clean.id){ const i = state.presupuestos.findIndex(p=>p.id===clean.id); state.presupuestos[i] = clean; }
  else { clean.id = uid(); state.presupuestos.push(clean); }
  await persist('presupuestos');
  state.builder=null;
  toast('Presupuesto guardado (v'+clean.version+')'); render();
}

async function enviarPresupuesto(){
  const b = state.builder;
  if(!confirm('¿Marcar este presupuesto como enviado? Se programará un aviso de seguimiento en 7 días.')) return;
  b.estado = 'enviado';
  b.fechaEnvio = todayISO();
  b.fechaSeguimiento = fechaMasDias(b.fechaEnvio, 7);
  agregarHistorialEstado(b, 'enviado');
  const cliente = state.clientes.find(c=>c.id===b.clienteId);

function esperarLibreriaPDF(intentos){
  return new Promise((resolve,reject)=>{
    intentos = intentos||0;
    if(window.jspdf && window.jspdf.jsPDF){ resolve(); return; }
    if(intentos>40){ reject(new Error('No se pudo cargar el generador de PDF')); return; }
    setTimeout(()=>esperarLibreriaPDF(intentos+1).then(resolve).catch(reject), 150);
  });
}
async function generarCertificadoMateriales(b){
  if(!b.partidas || !b.partidas.length){ toast('Añade al menos una partida antes de generar el certificado', true); return; }
  toast('Generando certificado…');
  try{ await esperarLibreriaPDF(); }
  catch(e){ toast('No se pudo cargar el generador de PDF (revisa la conexión a internet)', true); return; }

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'mm', format:'a4'});
  const marginX = 18;
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();
  const cliente = state.clientes.find(c=>c.id===b.clienteId);
  const partidas = b.partidas;
  const t = calcBuilderTotales(b);
  const accent = [173,122,44];
  const gris = [90,92,96];

  function piePagina(){
    const n = doc.internal.getNumberOfPages();
    for(let i=1;i<=n;i++){
      doc.setPage(i);
      doc.setFontSize(8); doc.setTextColor(150);
      doc.text('Certificado de materiales · '+(b.proyecto||'Presupuesto'), marginX, pageH-10);
      doc.text('Página '+i+' / '+n, pageW-marginX, pageH-10, {align:'right'});
      doc.setTextColor(0);
    }
  }

  // ---- Portada ----
  doc.setFont('helvetica','bold'); doc.setFontSize(20); doc.setTextColor(...accent);
  doc.text('CERTIFICADO DE ARTÍCULOS', marginX, 32);
  doc.text('PRESUPUESTADOS', marginX, 42);
  doc.setTextColor(0);
  doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(...gris);
  doc.text('Fachadas Ventiladas · Gestor de presupuestos', marginX, 50);
  doc.setTextColor(0);

  doc.setDrawColor(...accent); doc.setLineWidth(0.6); doc.line(marginX, 56, pageW-marginX, 56);

  let cy = 68;
  const dataLine = (label, value)=>{
    doc.setFont('helvetica','bold'); doc.setFontSize(10.5); doc.text(label+':', marginX, cy);
    doc.setFont('helvetica','normal'); doc.text(String(value||'—'), marginX+48, cy);
    cy += 8;
  };
  dataLine('Proyecto', b.proyecto);
  dataLine('Cliente', cliente? cliente.nombre : '—');
  if(cliente && cliente.direccion) dataLine('Dirección cliente', cliente.direccion);
  dataLine('Fecha', fmtFecha(b.fecha));
  dataLine('Versión', 'v'+(b.version||1)+(b.variante&&b.variante!=='Principal'? ' · '+b.variante : ''));
  dataLine('Nº de presupuesto', b.numero? ('#'+String(b.numero).padStart(4,'0')) : 'Sin guardar');
  dataLine('Superficie total', fmtNum(t.m2Total,1)+' m²');
  dataLine('Mes de referencia (precio Al.)', fmtMes(b.mesRef));
  if(b.precioAluminioOverride) dataLine('Precio Al. personalizado (€/kg)', fmtEUR(b.precioAluminioOverride)+' — solo para este presupuesto');

  cy += 6;
  doc.setDrawColor(220); doc.setLineWidth(0.2); doc.line(marginX, cy, pageW-marginX, cy);
  cy += 10;
  doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.text('Índice', marginX, cy); cy += 9;
  doc.setFont('helvetica','normal'); doc.setFontSize(10.5);
  const indexEntryY = [];
  partidas.forEach((p,i)=>{
    indexEntryY.push(cy);
    doc.text((i+1)+'. '+(p.nombre||'Partida sin nombre')+'  ('+fmtNum(p.cantidad,2)+' '+p.unidad+')', marginX, cy);
    cy += 7.5;
  });
  const resumenIndexY = cy;
  doc.text((partidas.length+1)+'. Resumen económico', marginX, cy);
  cy += 7.5;

  const pageForPartida = [];

  // ---- Secciones por partida ----
  partidas.forEach((p, idx)=>{
    doc.addPage();
    pageForPartida.push(doc.internal.getNumberOfPages());
    doc.setFont('helvetica','bold'); doc.setFontSize(14); doc.setTextColor(...accent);
    doc.text((idx+1)+'. '+(p.nombre||'Partida sin nombre'), marginX, 22);
    doc.setTextColor(0);
    doc.setFont('helvetica','normal'); doc.setFontSize(10);
    doc.text('Cantidad de la partida: '+fmtNum(p.cantidad,2)+' '+p.unidad+'   ·   Modo: '+((p.sistema&&p.sistema.modo)==='completa'?'Obra completa':'Área representativa')+'   ·   Beneficio de material: '+fmtNum((p.sistema&&p.sistema.beneficioPct)||0,1)+'%', marginX, 29);

    let yDescripcion = 29;
    if(p.descripcion && p.descripcion.trim()){
      doc.setFont('helvetica','italic'); doc.setFontSize(9); doc.setTextColor(90);
      const lineasDesc = doc.splitTextToSize(p.descripcion.trim(), pageW - marginX*2);
      doc.text(lineasDesc, marginX, 35);
      yDescripcion = 35 + lineasDesc.length*4.2;
      doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(0);
    }

    const calc = calcPartida(p, b.mesRef, b.precioAluminioOverride);
    let afterY = Math.max(32, yDescripcion+3);
    if(calc.items.length){
      const body = calc.items.map(it=>{
        const art = it.art;
        const unidad = art && esPerfil(art) ? 'ml' : (art? 'ud' : '');
        const desc = it.descripcion || (art? descripcionAuto(art) : (it.tipo==='texto'?'(sin descripción)':'Artículo eliminado'));
        return [
          desc,
          art? (art.referenciaPropia||'—') : '—',
          art? nombreProveedor(art.proveedorId) : (it.tipo==='texto'?'Línea manual':'—'),
          fmtNum(it.cantidad,2)+(unidad?' '+unidad:''),
          fmtNum(it.desperdicioPct||0,0)+'%',
          fmtNum(it.margenPct||0,0)+'%',
          it.pu!=null? fmtEUR(it.pu) : '—',
          fmtEUR(it.costeUnidad),
        ];
      });
      doc.autoTable({
        startY: 34,
        head: [['Descripción (artículo/acabado)','Ref. propia','Proveedor','Cantidad','Desper.','Margen','Precio ud.','Coste']],
        body,
        styles:{fontSize:8, cellPadding:2.2, textColor:[30,30,30]},
        headStyles:{fillColor:accent, textColor:255, fontStyle:'bold'},
        alternateRowStyles:{fillColor:[248,247,244]},
        margin:{left:marginX, right:marginX, bottom:20},
      });
      afterY = (doc.lastAutoTable ? doc.lastAutoTable.finalY : 40) + 8;
      if(afterY > pageH-40){ doc.addPage(); afterY = 22; }
      doc.setFont('helvetica','bold'); doc.setFontSize(10.5);
      doc.text('Coste material: '+fmtEUR(calc.costeMaterialTotal)+'   Beneficio: '+fmtEUR(calc.beneficioImporte)+'   → Sistema: '+fmtEUR(calc.sistemaTotal), marginX, afterY);
      afterY += 8;
    }
    if(calc.manoObraTotal>0 || calc.revestimientoTotal>0 || calc.portesTotal>0 || calc.customTotal>0){
      doc.setFont('helvetica','normal'); doc.setFontSize(10);
      if(calc.manoObraTotal>0){ doc.text('Mano de obra: '+fmtEUR(calc.manoObraTotal), marginX, afterY); afterY+=6.5; }
      if(calc.revestimientoTotal>0){
        const rvDesc = (p.revestimiento&&p.revestimiento.descripcion) ? ' — '+p.revestimiento.descripcion : '';
        doc.text('Revestimiento'+rvDesc+': '+fmtEUR(calc.revestimientoTotal), marginX, afterY); afterY+=6.5;
      }
      if(calc.portesTotal>0){ doc.text('Portes: '+fmtEUR(calc.portesTotal), marginX, afterY); afterY+=6.5; }
      (calc.lineasCustom||[]).forEach(c=>{ if(c.total>0){ doc.text((c.nombre||'Otro concepto')+': '+fmtEUR(c.total), marginX, afterY); afterY+=6.5; } });
      afterY += 2;
    }
    doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(...accent);
    doc.text('Total partida: '+fmtEUR(calc.totalPartida)+'  ('+fmtEUR(calc.repercusion)+'/'+p.unidad+')', marginX, afterY);
    doc.setTextColor(0);
    afterY += 10;

    // fichas técnicas adjuntas (si ya están cargadas en memoria)
    const docsList = calc.items.filter(it=>it.art && state.catalogoMedia[it.art.id] && state.catalogoMedia[it.art.id].documentos && state.catalogoMedia[it.art.id].documentos.length);
    if(docsList.length){
      doc.setFont('helvetica','italic'); doc.setFontSize(9); doc.setTextColor(...gris);
      doc.text('Fichas técnicas disponibles en la app para: '+docsList.map(it=>it.art.nombre).join(', '), marginX, afterY, {maxWidth:pageW-marginX*2});
      doc.setTextColor(0);
    }
  });

  // ---- Resumen económico ----
  doc.addPage();
  const summaryPage = doc.internal.getNumberOfPages();
  doc.setFont('helvetica','bold'); doc.setFontSize(14); doc.setTextColor(...accent);
  doc.text((partidas.length+1)+'. Resumen económico', marginX, 22);
  doc.setTextColor(0);
  doc.setFont('helvetica','normal'); doc.setFontSize(10.5);
  let sy = 36;
  const sline = (label, val, bold)=>{
    doc.setFont('helvetica', bold?'bold':'normal');
    doc.text(label, marginX, sy);
    doc.text(val, pageW-marginX, sy, {align:'right'});
    sy += 8;
  };
  partidas.forEach((p,i)=>{ sline((i+1)+'. '+(p.nombre||'Partida sin nombre'), fmtEUR(p.calc? p.calc.totalPartida : calcPartida(p,b.mesRef,b.precioAluminioOverride).totalPartida)); });
  sline('Subtotal partidas', fmtEUR(t.subtotalPartidas), true);
  sline('  de las cuales — Sistema', fmtEUR(t.sistemaTotal));
  sline('  de las cuales — Mano de obra', fmtEUR(t.manoObraTotal));
  sline('  de las cuales — Revestimiento', fmtEUR(t.revestimientoTotal));
  sline('  de las cuales — Portes', fmtEUR(t.portesTotal));
  sline('Otros costes generales', fmtEUR(t.otros));
  doc.setDrawColor(220); doc.line(marginX, sy-4, pageW-marginX, sy-4);
  sline('Subtotal', fmtEUR(t.subtotal), true);
  sline('Margen ('+fmtNum(b.margen,1)+'%)', fmtEUR(t.margenImporte));
  sline('Base imponible', fmtEUR(t.base));
  sline('IVA ('+fmtNum(b.iva,1)+'%)', fmtEUR(t.ivaImporte));
  doc.setDrawColor(...accent); doc.setLineWidth(0.5); doc.line(marginX, sy-4, pageW-marginX, sy-4);
  doc.setFontSize(13); doc.setTextColor(...accent);
  sline('TOTAL', fmtEUR(t.total), true);
  doc.setTextColor(0);

  // ---- Rellenar índice con números de página ----
  doc.setPage(1);
  doc.setFont('helvetica','normal'); doc.setFontSize(10.5); doc.setTextColor(...gris);
  partidas.forEach((p,i)=>{ doc.text('Pág. '+pageForPartida[i], pageW-marginX, indexEntryY[i], {align:'right'}); });
  doc.text('Pág. '+summaryPage, pageW-marginX, resumenIndexY, {align:'right'});
  doc.setTextColor(0);

  piePagina();

  const nombreArchivo = 'Certificado_'+(b.proyecto||'presupuesto').replace(/[^a-zA-Z0-9]+/g,'_')+'_v'+(b.version||1)+'.pdf';
  doc.save(nombreArchivo);
  toast('Certificado generado');
}

function modalConfirmarVaciar(){
  return `<h3>Vaciar datos del presupuestador</h3>
    <div class="modal-sub">Esto eliminará presupuestos, precios de aluminio, plantillas y festivos guardados, y los sustituirá por datos de ejemplo. <strong>No toca obras, proveedores, clientes, personal ni el catálogo</strong> — esos son compartidos de verdad con la app de almacén y nunca se borran desde aquí. Esta acción no se puede deshacer.</div>
    <div class="modal-foot"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" style="background:var(--danger);border-color:var(--danger);" onclick="confirmarVaciarTodo()">Sí, vaciar y cargar ejemplos</button></div>`;
}
async function confirmarVaciarTodo(){
  closeModal();
  const keysCompartidas = Object.keys(ENTIDADES_RELACIONALES);
  for(const k of KEYS){ if(!keysCompartidas.includes(k)) state[k] = []; }
  for(const k of KEYS){ if(!keysCompartidas.includes(k)) await persist(k); }
  state.builder = null; state.modal = null;
  await seedExampleData(true);
}
window.confirmarVaciarTodo = confirmarVaciarTodo;
function modalConfirmarSeed(){
  return `<h3>Cargar datos de ejemplo</h3>

}

async function toggleDarkMode(){
  const isDark = document.body.classList.toggle('dark');
  document.getElementById('dark-toggle-label').textContent = isDark? 'Modo claro' : 'Modo oscuro';
  await persistRaw('darkMode', isDark);
  if(typeof L!=='undefined' && document.getElementById('leaflet-map')) renderLeafletMap();
}
window.toggleDarkMode = toggleDarkMode;
async function aplicarModoOscuroGuardado(){
  try{
    const r = await window.storage.get('darkMode', false);
    const isDark = r && r.value ? JSON.parse(r.value) : false;
    if(isDark){ document.body.classList.add('dark'); document.getElementById('dark-toggle-label').textContent = 'Modo claro'; }
  }catch(e){}
}
