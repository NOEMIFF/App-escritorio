<style>
  @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Manrope:wght@400;500;600;700;800&display=swap');
  :root{
    --bg:#F0EFEC; --sidebar-bg:#16171A;
    --surface-1:#FFFFFF; --surface-2:#F4F3F0; --surface-3:#EDECE7;
    --border:#E5E4DF; --border-strong:#D3D1CA;
    --text-primary:#16171A; --text-secondary:#6A6C71; --text-faint:#A2A4A9;
    --accent:#FFC800; --accent-dark:#E0AD00; --accent-soft:#FFF3CC; --accent-text:#8A6800;
    --steel:#3E6E8E; --steel-soft:#E7F0F5;
    --out:#C74A11; --out-soft:#F9E9E0;
    --ok:#20794A; --ok-soft:#E1EFE7;
    --danger:#C22E2E; --danger-soft:#FAE7E7;
    --sans:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    --disp:'Bricolage Grotesque',var(--sans);
    --num:'Bricolage Grotesque',var(--sans);
    --sbw:246px;
  }
  body.dark{
    --bg:#0F0F11; --sidebar-bg:#0A0A0B;
    --surface-1:#1A1A1D; --surface-2:#242428; --surface-3:#2B2B30;
    --border:#2A2A2E; --border-strong:#38383E;
    --text-primary:#F5F4F2; --text-secondary:#9EA0A6; --text-faint:#6B6D73;
    --accent:#FFC800; --accent-dark:#FFD84D; --accent-soft:#33291A; --accent-text:#FFC800;
    --steel:#6FA3C7; --steel-soft:#1C2C38;
    --out:#F0844B; --out-soft:#2A1911;
    --ok:#4FBE7A; --ok-soft:#12251A;
    --danger:#F27070; --danger-soft:#2A1515;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text-primary);font-family:var(--sans);font-size:14px;-webkit-font-smoothing:antialiased;}
  #app{display:flex;min-height:100vh;}
  ::selection{background:var(--accent-soft);color:var(--accent-text);}

  #sidebar{
    width:var(--sbw);flex:0 0 var(--sbw);background:var(--sidebar-bg);color:#fff;
    background-image:repeating-linear-gradient(115deg, rgba(255,255,255,.02) 0px, rgba(255,255,255,.02) 1px, transparent 1px, transparent 12px);
    display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
  }
  #brand{padding:24px 20px 18px;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:11px;}
  #brand .mark{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;flex:0 0 auto;border:1px solid rgba(255,255,255,.1);}
  #brand h1{font-family:var(--disp);font-size:14.5px;margin:0 0 2px;font-weight:600;letter-spacing:.1px;line-height:1.25;color:#fff;}
  #brand p{font-size:10px;margin:0;color:rgba(255,255,255,.45);letter-spacing:.6px;text-transform:uppercase;}
  nav{padding:16px 12px;flex:1;}
  .nav-eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:rgba(255,255,255,.35);padding:4px 12px 10px;font-weight:600;}
  .nav-item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:7px;color:rgba(255,255,255,.68);cursor:pointer;font-size:13.5px;font-weight:500;margin-bottom:1px;border-left:2px solid transparent;transition:background .12s,color .12s;}
  .nav-item svg{width:17px;height:17px;flex:0 0 auto;opacity:.8;}
  .nav-item:hover{background:rgba(255,255,255,.06);color:#fff;}
  .nav-item.active{background:rgba(255,255,255,.08);color:#fff;border-left-color:var(--accent);}
  .nav-item.active svg{opacity:1;color:#E0B45E;}
  .nav-badge{margin-left:auto;font-family:var(--num);font-size:10px;background:rgba(255,255,255,.1);padding:1px 6px;border-radius:99px;color:rgba(255,255,255,.6);}
  .nav-item.active .nav-badge{background:rgba(224,180,94,.22);color:#E0B45E;}
  #sidebar-foot{padding:14px 16px 18px;border-top:1px solid rgba(255,255,255,.1);display:flex;flex-direction:column;gap:6px;}
  #sidebar-foot button{background:transparent;border:1px solid rgba(255,255,255,.14);color:rgba(255,255,255,.6);font-size:11.5px;padding:7px 10px;border-radius:6px;text-align:left;display:flex;align-items:center;gap:7px;}
  #sidebar-foot button svg{width:14px;height:14px;flex:0 0 auto;}
  #sidebar-foot button:hover{background:rgba(255,255,255,.06);color:#fff;}

  #main{flex:1;min-width:0;padding:32px 40px 70px;}
  .view-fade{animation:viewFade .28s ease;}
  @keyframes viewFade{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}

  .topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:6px;}
  .topbar .head{display:flex;align-items:center;gap:13px;}
  .topbar .headicon{width:40px;height:40px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .topbar .headicon svg{width:19px;height:19px;}
  .topbar h2{font-family:var(--disp);font-size:23px;margin:0;font-weight:700;letter-spacing:-.2px;color:var(--text-primary);}
  .topbar .sub{color:var(--text-secondary);font-size:12.5px;margin-top:3px;}
  .topbar .actions{display:flex;gap:8px;flex:0 0 auto;}
  .dimline{height:16px;position:relative;margin:18px 0 24px;border-top:1px solid var(--border);}
  .dimline::before,.dimline::after{content:"";position:absolute;top:-4px;width:1px;height:8px;background:var(--border-strong);}
  .dimline::before{left:0;} .dimline::after{right:0;}

  button{font-family:var(--sans);cursor:pointer;transition:background .12s,border-color .12s,transform .08s;}
  button:active{transform:scale(.98);}
  .btn{border:1px solid var(--border-strong);background:var(--surface-1);color:var(--text-primary);padding:8px 14px;border-radius:7px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;}
  .btn:hover{border-color:var(--text-faint);background:var(--surface-2);}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:var(--sidebar-bg);font-weight:600;}
  .btn-primary:hover{background:var(--accent-dark);}
  .btn-accent{background:var(--accent);border-color:var(--accent);color:var(--sidebar-bg);font-weight:600;}
  .btn-accent:hover{background:var(--accent-dark);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .btn-sm{padding:5px 10px;font-size:12px;border-radius:6px;}
  .btn svg{width:14px;height:14px;}
  .btn-icon{padding:8px 9px;flex:0 0 auto;}

  input,select,textarea{font-family:var(--sans);font-size:13px;padding:8px 10px;border:1px solid var(--border-strong);border-radius:7px;background:var(--surface-2);color:var(--text-primary);width:100%;transition:border-color .12s,box-shadow .12s;}
  input::placeholder{color:var(--text-faint);}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);background:var(--surface-1);}
  label{display:block;font-size:11px;color:var(--text-secondary);margin-bottom:5px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;}
  .field{margin-bottom:13px;}
  .row{display:flex;gap:12px;}
  .row > .field{flex:1;}
  .checkfield{display:inline-flex;align-items:center;gap:7px;text-transform:none;font-weight:500;font-size:13px;color:var(--text-primary);}
  .checkfield input{width:auto;}
  .select-plus{display:flex;gap:6px;align-items:stretch;}
  .select-plus select{flex:1;}
  .hint{font-size:11.5px;color:var(--text-faint);margin-top:5px;}

  .card{background:var(--surface-1);border:1px solid var(--border);border-radius:16px;padding:20px 22px;margin-bottom:18px;box-shadow:0 1px 2px rgba(20,20,15,.03);}
  .card h3{margin:0 0 16px;padding-bottom:12px;border-bottom:1px solid var(--border);font-size:11px;font-weight:700;font-style:italic;font-family:var(--sans);letter-spacing:.7px;text-transform:uppercase;color:#000;}
  .card-tools{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px;}
  .card-tools .field{margin-bottom:0;min-width:150px;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--text-faint);padding:9px 10px;border-bottom:1px solid var(--border);font-weight:600;}
  td{padding:10px 10px;border-bottom:1px solid var(--border);vertical-align:middle;color:var(--text-primary);}
  tbody tr:hover td{background:var(--surface-2);}
  .num{font-family:var(--num);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;}
  .muted{color:var(--text-faint);}
  .tag{display:inline-block;padding:2.5px 9px;border-radius:99px;font-size:11px;font-weight:600;background:var(--steel-soft);color:var(--steel);}
  .tag-accent{background:var(--accent-soft);color:var(--accent-text);}
  .empty{padding:48px 20px;text-align:center;color:var(--text-faint);font-size:13px;display:flex;flex-direction:column;align-items:center;gap:12px;}
  .empty svg{width:34px;height:34px;opacity:.35;}
  .empty .btn{margin-top:4px;}

  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:20px;}
  .kpi{background:var(--surface-1);border:1px solid var(--border);border-radius:13px;padding:16px 18px;box-shadow:0 1px 2px rgba(20,20,15,.03);}
  .kpi .lbl{font-size:10.5px;text-transform:uppercase;color:var(--text-secondary);letter-spacing:.4px;font-weight:600;margin-bottom:8px;}
  .kpi .val{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:22px;font-weight:700;color:var(--text-primary);}
  .kpi .foot{font-size:11px;color:var(--text-faint);margin-top:4px;}

  .chart-legend{display:flex;flex-wrap:wrap;margin-bottom:10px;}
  .costbar{display:flex;height:14px;border-radius:7px;overflow:hidden;margin-bottom:16px;background:var(--surface-3);}
  .costbar-legend{display:grid;grid-template-columns:1fr 1fr;gap:9px 24px;margin-bottom:4px;}
  .dropdown-menu{position:absolute;top:calc(100% + 4px);right:0;background:var(--surface-1);border:1px solid var(--border-strong);border-radius:10px;box-shadow:0 14px 32px rgba(20,20,15,.18);z-index:9999;min-width:210px;padding:6px;}
  .dropdown-menu.left{right:auto;left:0;}
  .dropdown-item{padding:9px 12px;border-radius:7px;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:9px;white-space:nowrap;}
  .dropdown-item:hover{background:var(--surface-2);}
  .dropdown-item.danger{color:var(--danger);}
  .dropdown-item svg{width:15px;height:15px;flex:0 0 auto;}
  .menu-backdrop{position:fixed;inset:0;z-index:9998;}
  .marcador-clicable{cursor:pointer;}
  .dropzone-obra{background:var(--surface-2);border:1.5px solid var(--border) !important;}
  .fila-presupuesto:hover{background:var(--surface-2);}
  .fila-presupuesto.expandida{background:var(--accent-soft);}
  .fila-resumen-presupuesto{cursor:default;}
  .capitulo-card{border-left:4px solid var(--accent) !important;padding:16px 18px;margin-bottom:16px;}
  .cap-numero{flex:0 0 auto;width:26px;height:26px;border-radius:7px;background:var(--accent-soft);color:var(--accent-text);font-family:var(--num);font-weight:700;font-size:11px;display:flex;align-items:center;justify-content:center;}
  .cap-nombre-input{flex:1;min-width:0;font-weight:700;font-size:14.5px;font-family:var(--disp);border:1px solid transparent;background:transparent;padding:5px 7px;border-radius:6px;color:var(--text-primary);}
  .cap-nombre-input:hover{background:var(--surface-2);}
  .cap-nombre-input:focus{background:var(--surface-1);border-color:var(--accent);outline:none;}
  .partida-nombre-input{width:100%;font-weight:700;font-size:13.5px;border:1px solid transparent;background:transparent;padding:3px 6px;border-radius:6px;color:var(--text-primary);}
  .partida-nombre-input:hover{background:var(--surface-1);}
  .partida-nombre-input:focus{background:var(--surface-1);border-color:var(--accent);outline:none;}
  .info-icon{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:50%;background:var(--surface-3);color:var(--text-secondary);font-size:10px;font-style:italic;font-family:Georgia,serif;font-weight:700;cursor:help;margin-left:5px;vertical-align:middle;text-transform:lowercase !important;}
  .info-icon:hover{background:var(--accent-soft);color:var(--accent-text);}
  .tabla-sistema{border-collapse:separate;border-spacing:0;width:100%;}
  .tabla-sistema th{text-align:right;white-space:nowrap;font-size:9.5px;padding:6px 6px;}
  .tabla-sistema th:first-child, .tabla-sistema td:first-child{text-align:left;}
  .tabla-sistema td{padding:4px 6px;vertical-align:middle;}
  .tabla-sistema td input, .tabla-sistema td select{width:100%;text-align:right;padding:5px 6px;font-size:12px;}
  .tabla-sistema td:first-child input{text-align:left;}
  .tabla-sistema .col-num{width:72px;}
  .tabla-sistema .col-precio{width:82px;}
  .capitulo-body{margin:12px 0 0;padding-left:16px;border-left:2px solid var(--border);display:flex;flex-direction:column;gap:8px;}
  .partida-card-nested{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;transition:border-color .12s,background .12s;}
  .partida-card-nested:hover{border-color:var(--border-strong);}
  .fila-resumen-presupuesto td table td{border:none;}
  .dropzone-obra.drag-over{border-color:var(--accent) !important;background:var(--accent-soft);box-shadow:0 0 0 3px var(--accent-soft);}
  .personal-drag-row.dragging{opacity:.4;}
  .personal-drag-row:active{cursor:grabbing;}
  .personal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;}
  .obras-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;}
  .obra-card-grande{padding:20px;}
  .planning-row{display:flex;align-items:stretch;border-top:1px solid var(--border);}
  .planning-row:first-child{border-top:none;}
  .planning-label{flex:0 0 170px;padding:6px 10px 6px 0;display:flex;align-items:center;gap:6px;cursor:pointer;min-width:0;}
  .planning-timeline{flex:1;display:grid;min-height:34px;position:relative;}
  .personal-card{position:relative;background:var(--surface-1);border:1px solid var(--border);border-radius:13px;padding:18px 16px 16px;transition:border-color .12s,box-shadow .12s;}
  .personal-card:hover{border-color:var(--border-strong);box-shadow:0 6px 16px rgba(20,20,15,.06);}
  #leaflet-map{isolation:isolate;position:relative;z-index:0;}
  .dash-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;height:calc(100vh - 300px);min-height:340px;}
  .dash-left{display:flex;flex-direction:column;gap:14px;min-height:0;overflow:hidden;}
  .dash-right{min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:14px;}
  .dash-right .card{width:100%;}
  .cal-grid.compact{grid-template-columns:20px repeat(7,1fr);gap:2px;}
  .cal-day.compact{min-height:30px;padding:2px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:1px;border-radius:5px;}
  .cal-day.compact .cal-day-num{font-size:10px;margin-bottom:0;font-weight:500;}
  .cal-grid.compact .cal-week-num{font-size:9px;}
  .cal-grid.compact .cal-head{font-size:9px;padding:0 0 3px;}
  .cal-day-dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;}
  .cal-dot{width:4.5px;height:4.5px;border-radius:50%;display:inline-block;cursor:pointer;flex:0 0 auto;}
  @media (max-width:1100px){ .dash-grid{grid-template-columns:1fr;height:auto;} .dash-right{height:420px;} }
  .cal-grid{display:grid;grid-template-columns:36px repeat(7,1fr);gap:4px;}
  .cal-head{text-align:center;font-size:10.5px;font-weight:700;text-transform:uppercase;color:var(--text-faint);padding:4px 0;}
  .cal-week-num{display:flex;align-items:center;justify-content:center;font-size:10.5px;color:var(--text-faint);font-family:var(--num);}
  .cal-week-num.head{font-weight:700;text-transform:uppercase;}
  .cal-day{border:1px solid var(--border);border-radius:8px;min-height:74px;padding:5px;cursor:pointer;background:var(--surface-1);transition:border-color .12s;overflow:hidden;}
  .cal-day:hover{border-color:var(--accent);}
  .cal-day.out{background:var(--surface-2);opacity:.5;}
  .cal-day.today{border-color:var(--accent);background:var(--accent-soft);}
  .cal-day.weekend{background:var(--surface-2);}
  .cal-day.weekend.out{opacity:.4;}
  .cal-day.festivo-nacional{background:#F6E4DF;}
  .cal-day.festivo-local{background:#F1E7F5;}
  body.dark .cal-day.festivo-nacional{background:#3A231D;}
  body.dark .cal-day.festivo-local{background:#2C223A;}
  .cal-day.today.festivo-nacional,.cal-day.today.festivo-local{background:var(--accent-soft);}
  .cal-day-num{font-family:var(--num);font-size:12px;font-weight:600;margin-bottom:3px;}
  .cal-day-evs{display:flex;flex-direction:column;gap:2px;}
  .cal-ev-pill{font-size:10px;padding:2px 5px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;}
  @media (max-width:900px){ .cal-grid{grid-template-columns:26px repeat(7,1fr);} .cal-day{min-height:52px;font-size:10px;} }
  .partida-linea{display:flex;align-items:center;padding:9px 12px;border:1px solid var(--border);border-radius:9px;margin-bottom:6px;background:var(--surface-1);font-weight:600;font-size:13px;transition:border-color .12s;}
  .partida-linea:hover{border-color:var(--text-faint);}
  .partida-linea.open{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-text);border-bottom-left-radius:0;border-bottom-right-radius:0;margin-bottom:0;}
  .partida-linea .num{font-weight:600;}
  .partida-linea-contenido{padding:13px 14px;border:1px solid var(--accent);border-top:none;border-radius:0 0 9px 9px;margin-bottom:6px;background:var(--surface-1);}
  .partida-linea-contenido .field{margin-bottom:9px;}
  .partida-linea-contenido table td, .partida-linea-contenido table th{padding:6px 8px;}

  #toast{position:fixed;bottom:22px;right:22px;background:var(--sidebar-bg);color:#fff;padding:11px 18px;border-radius:9px;font-size:12.5px;opacity:0;transform:translateY(8px);transition:all .25s;pointer-events:none;z-index:80;box-shadow:0 10px 28px rgba(0,0,0,.22);}
  #toast.show{opacity:1;transform:translateY(0);}
  #toast.err{background:var(--danger);}

  .item-row td{padding:6px 8px;}
  .item-row select, .item-row input{padding:6px 8px;font-size:12.5px;}
  .icon-btn{border:none;background:transparent;color:var(--text-faint);padding:5px 6px;border-radius:6px;display:inline-flex;}
  .icon-btn svg{width:15px;height:15px;}
  .icon-btn:hover{color:var(--danger);background:var(--danger-soft);}
  .icon-btn.edit:hover{color:var(--steel);background:var(--steel-soft);}

  .summary-line{display:flex;justify-content:space-between;padding:7px 0;font-size:13px;color:var(--text-secondary);}
  .summary-line .val{font-family:var(--num);font-variant-numeric:tabular-nums;font-weight:600;color:var(--text-primary);}
  .summary-line.total{border-top:1px solid var(--border);margin-top:8px;padding-top:14px;font-size:18px;font-weight:700;color:var(--text-primary);}
  .summary-line.total .val{color:var(--accent);}

  .modal-overlay{position:fixed;inset:0;background:rgba(26,27,30,.45);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:70;padding:20px;}
  .modal-box{background:var(--surface-1);border:1px solid var(--border);border-radius:15px;max-width:480px;width:100%;max-height:88vh;overflow:auto;padding:24px 26px;box-shadow:0 30px 60px rgba(20,20,15,.18);}
  .modal-box-ancha{max-width:820px;}
  .modal-box h3{margin:0 0 4px;font-family:var(--disp);font-size:16.5px;font-weight:600;color:var(--text-primary);}
  .modal-sub{font-size:12px;color:var(--text-secondary);margin-bottom:18px;}
  .modal-foot{display:flex;gap:8px;margin-top:8px;justify-content:flex-end;}

  .stepper{display:flex;align-items:center;margin-bottom:22px;}
  .step{display:flex;align-items:center;gap:9px;font-size:12.5px;font-weight:600;color:var(--text-faint);cursor:pointer;padding:4px;white-space:nowrap;}
  .step .stepnum{width:23px;height:23px;border-radius:50%;background:var(--surface-2);border:1px solid var(--border-strong);display:flex;align-items:center;justify-content:center;font-family:var(--num);font-size:11px;color:var(--text-secondary);flex:0 0 auto;}
  .step.active{color:var(--text-primary);} .step.active .stepnum{background:var(--accent);border-color:var(--accent);color:var(--sidebar-bg);}
  .step.done .stepnum{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);}
  .stepline{flex:1;height:1px;background:var(--border);margin:0 10px;min-width:16px;}

  .wizard-wrap{padding-bottom:86px;}

async function sincronizarMaterialesDesdeCatalogo(arr){
  const filas = arr.map(a=>{
    const prov = state.proveedores.find(p=>p.id===a.proveedorId);
    return {
      codigo: 'CAT-'+a.id,
      descripcion: a.nombre||'',
      unidad: (a.esAluminio && a.tipo==='Perfilería') ? 'ml' : 'ud',
      grupo: a.tipo || 'Catálogo',
      proveedor: prov? prov.nombre : null,
      codigo_propio: a.referenciaPropia || null,
      catalogo_articulo_id: a.id,
      eliminado: false, actualizado_en: Date.now()
    };
  });
  if(filas.length){
    const { error } = await sb.from('materiales').upsert(filas, {onConflict:'codigo'});
    if(error) console.error('Sync materiales desde catálogo', error);
  }
  const idsActuales = new Set(arr.map(a=>'CAT-'+a.id));
  const { data: existentesSincronizados } = await sb.from('materiales').select('codigo').eq('eliminado', false).not('catalogo_articulo_id','is', null);
  const borrados = (existentesSincronizados||[]).map(x=>x.codigo).filter(c=>!idsActuales.has(c));
  if(borrados.length){
    await sb.from('materiales').update({eliminado:true, actualizado_en:Date.now()}).in('codigo', borrados);
  }
}

async function supabaseGetArray(key){
  const cfg = ENTIDADES_RELACIONALES[key];
  const { data, error } = await sb.from(cfg.tabla).select('*').eq('eliminado', false);
  if(error){ console.error('Supabase get '+key, error); return []; }
  return data.map(cfg.aObjeto);
}
async function supabaseSetArray(key, arr){
  const cfg = ENTIDADES_RELACIONALES[key];
  const { data: existentes } = await sb.from(cfg.tabla).select('codigo').eq('eliminado', false);
  const idsActuales = new Set(arr.map(x=>x.id));
  const idsExistentes = new Set((existentes||[]).map(x=>x.codigo));
  const filas = arr.map(cfg.aFila);
  if(filas.length){
    const { error } = await sb.from(cfg.tabla).upsert(filas, {onConflict:'codigo'});
    if(error){ console.error('Supabase set '+key, error); return false; }
  }
  const borrados = [...idsExistentes].filter(id=>!idsActuales.has(id));
  if(borrados.length){
    await sb.from(cfg.tabla).update({eliminado:true, actualizado_en:Date.now()}).in('codigo', borrados);
  }
  if(key==='catalogo'){ await sincronizarMaterialesDesdeCatalogo(arr); }
  return true;
}

/* Adaptador: misma forma que el almacenamiento del artefacto
   (get/set/delete/list), pero hablando con Supabase por dentro. */
window.storage = {
  async get(key, shared){
    if(ENTIDADES_RELACIONALES[key]){
      const arr = await supabaseGetArray(key);
      return { key, value: JSON.stringify(arr), shared: !!shared };
    }
    const { data, error } = await sb.from('app_config').select('valor').eq('clave', key).maybeSingle();
    if(error || !data) return null;
    return { key, value: JSON.stringify(data.valor), shared: !!shared };
  },
  async set(key, value, shared){
    if(ENTIDADES_RELACIONALES[key]){
      const arr = JSON.parse(value);
      const ok = await supabaseSetArray(key, arr);
      return ok ? { key, value, shared: !!shared } : null;
    }
    let valor;
    try{ valor = JSON.parse(value); }catch(e){ valor = value; }
    const { error } = await sb.from('app_config').upsert({ clave:key, valor, actualizado_en: Date.now() }, {onConflict:'clave'});
    return error ? null : { key, value, shared: !!shared };
  },
  async delete(key, shared){
    if(ENTIDADES_RELACIONALES[key]) return null;
    const { error } = await sb.from('app_config').delete().eq('clave', key);
    return error ? null : { key, deleted:true, shared: !!shared };
  },
  async list(prefix, shared){
    const { data, error } = await sb.from('app_config').select('clave');
    if(error) return null;
    let keys = (data||[]).map(r=>r.clave);
    if(prefix) keys = keys.filter(k=>k.startsWith(prefix));
    return { keys, prefix, shared: !!shared };
  }
};

async function intentarLogin(){
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPass').value;
  const errorEl = document.getElementById('authError');
  errorEl.style.display = 'none';
  if(!email || !password) return;
  const btn = document.getElementById('authBtn');
  btn.disabled = true; btn.textContent = 'Entrando…';
  const { error } = await sb.auth.signInWithPassword({ email, password });
  btn.disabled = false; btn.textContent = 'Entrar';
  if(error){ errorEl.textContent = 'Error de Supabase: ' + error.message; errorEl.style.display = 'block'; console.error('Supabase auth error:', error); return; }
  mostrarApp();
}

  await sb.auth.signOut();
  location.reload();
}

  const norm = base.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9]/g,'').toUpperCase();

function resizeImageDataUrl(dataUrl, maxDim, quality){
  return new Promise((resolve)=>{
    const img = new Image();
    img.onload = ()=>{
      let w=img.width, h=img.height;
      if(w>maxDim || h>maxDim){ const scale = maxDim/Math.max(w,h); w=Math.round(w*scale); h=Math.round(h*scale); }
      const canvas = document.createElement('canvas'); canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = ()=>resolve(dataUrl);
    img.src = dataUrl;
  });
}
// Framing pass for catalog photos: centers the product on a uniform white square canvas
// so every article photo shares the same clean, consistent presentation at a glance.
// Note: this is NOT AI background removal (no product/background segmentation) — it just
// standardizes size, padding and framing. True background removal needs an external
// image-processing service, which isn't available inside this offline app.
function frameCatalogPhoto(dataUrl, size, quality){
  size = size||900; quality = quality||0.9;
  return new Promise((resolve)=>{
    const img = new Image();
    img.onload = ()=>{
      const canvas = document.createElement('canvas'); canvas.width=size; canvas.height=size;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0,0,size,size);
      const pad = size*0.08;
      const usable = size - pad*2;
      const scale = Math.min(usable/img.width, usable/img.height);
      const w = img.width*scale, h = img.height*scale;
      const x = (size-w)/2, y = (size-h)/2;
      ctx.drawImage(img, x, y, w, h);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = ()=>resolve(dataUrl);
    img.src = dataUrl;
  });
}

  return `<span class="info-icon" tabindex="0" title="${esc(texto)}">i</span>`;
}
function fmtTelefono(t){
  if(!t) return '—';
  const digits = String(t).replace(/\D/g,'');
  if(digits.length===9) return digits.replace(/(\d{3})(\d{3})(\d{3})/,'$1 $2 $3');
  return t;
}
function direccionCompletaHtml(e, prefijo){
  prefijo = prefijo || '';
  const calle = e[prefijo?('direccion'+prefijo):'direccion'];
  const poblacion = e['poblacion'+prefijo];
  const provincia = e['provincia'+prefijo];
  const cp = e['cp'+prefijo];
  const linea2 = [cp, poblacion, provincia].filter(Boolean).join(' ');
  if(!calle && !linea2) return '—';
  return esc(calle||'') + (linea2? `<div class="muted" style="font-size:11.5px;margin-top:2px;">${esc(linea2)}</div>` : '');
}
function fechaLocalISO(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fechaMasDias(iso, dias){ if(!iso) return null; const d = new Date(iso+'T00:00:00'); d.setDate(d.getDate()+dias); return fechaLocalISO(d); }
function todayISO(){ return fechaLocalISO(new Date()); }
function thisMonth(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function esc(s){ return (s===undefined||s===null)?'':String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg, isErr){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.toggle('err', !!isErr);
  t.classList.add('show');
  clearTimeout(window.__toastT);
  window.__toastT=setTimeout(()=>t.classList.remove('show'), isErr? 5000 : 2400);
}

async function exportarTodosLosDatos(){
  toast('Preparando la copia de seguridad, puede tardar unos segundos…');
  try{
    const listado = await window.storage.list(undefined, false);
    const keys = (listado && listado.keys) || [];
    if(!keys.length){ toast('No se encontraron datos guardados', true); return; }
    const claves = {};
    for(const k of keys){
      try{
        const r = await window.storage.get(k, false);
        if(!r || r.value===undefined || r.value===null){ claves[k] = null; continue; }
        try{ claves[k] = JSON.parse(r.value); }
        catch(e){ claves[k] = r.value; }
      }catch(e){ claves[k] = null; }
    }
    const payload = {
      app: 'Gestión NS — Fachadas Ventiladas',
      exportadoEl: new Date().toISOString(),
      numeroClaves: keys.length,
      claves,
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'backup_gestion_ns_'+todayISO()+'.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
    toast('Copia de seguridad descargada ('+keys.length+' claves)');
  }catch(e){
    toast('No se pudo exportar: '+(e&&e.message? e.message : 'error desconocido'), true);
  }
}
window.exportarTodosLosDatos = exportarTodosLosDatos;

const CONCEPTO_BASE = 'Precio kg';
const CONCEPTOS_ALUMINIO = [CONCEPTO_BASE, 'Anodizado en negro', 'Anodizado en plata', 'Lacado en negro', 'Lacado en RAL'];
const CONCEPTO_UNIDAD = {'Anodizado en negro':'kg','Anodizado en plata':'kg','Lacado en negro':'m2','Lacado en RAL':'m2'};
function unidadRecargoConcepto(concepto){ return CONCEPTO_UNIDAD[concepto] || 'kg'; }
function migrateAluminioData(){
  const legacy = state.preciosAluminio.filter(e=>e.precioKg!==undefined && e.concepto===undefined);
  if(legacy.length){
    const grouped = {};
    legacy.forEach(e=>{ (grouped[e.proveedorId]=grouped[e.proveedorId]||[]).push(e); });
    Object.keys(grouped).forEach(pid=>{
      const entries = grouped[pid].sort((a,b)=>a.mes.localeCompare(b.mes));
      let prev = 0;
      entries.forEach(e=>{
        const delta = Math.round((e.precioKg-prev)*100)/100;
        e.id = e.id || uid();
        e.concepto = CONCEPTO_BASE;
        e.direccion = delta<0 ? 'bajada' : 'subida';
        e.valor = Math.abs(delta);
        e.precioResultante = e.precioKg;
        delete e.precioKg;
        prev = e.precioResultante;
      });
    });
  }
  // Migra entradas mensuales antiguas (campo 'mes') a fecha diaria ('fecha')
  state.preciosAluminio.forEach(e=>{
    if(!e.fecha && e.mes){ e.fecha = e.mes+'-01'; delete e.mes; }
  });
}
function recalcAluminioCascade(proveedorId, concepto){
  const entries = state.preciosAluminio.filter(x=>x.proveedorId===proveedorId && x.concepto===concepto).sort((a,b)=>a.fecha.localeCompare(b.fecha));
  let running = 0;
  entries.forEach(e=>{
    if(e.direccion==='base'){ running = Math.round(e.valor*100)/100; }
    else{ const delta = e.direccion==='bajada' ? -Math.abs(e.valor) : Math.abs(e.valor); running = Math.round((running+delta)*100)/100; }
    e.precioResultante = running;
  });
}
function proveedoresExtrusionadoras(){ return state.proveedores.filter(p=>p.esExtrusionadora); }
function precioAluminioActual(proveedorId, mesRef, concepto){
  const c = concepto || CONCEPTO_BASE;
  const entradas = state.preciosAluminio.filter(p=>p.proveedorId===proveedorId && p.concepto===c).sort((a,b)=>b.fecha.localeCompare(a.fecha));
  if(!entradas.length) return null;
  if(mesRef){ const validas = entradas.filter(p=>p.fecha.slice(0,7)<=mesRef); if(validas.length) return validas[0]; }
  return entradas[0];
}
function recargoAcabadoActual(proveedorId, acabado, mesRef){
  if(!acabado || acabado===CONCEPTO_BASE) return 0;
  const e = precioAluminioActual(proveedorId, mesRef, acabado);
  return e? e.precioResultante : 0;
}
function precioEfectivoArticulo(art, mesRef, overrideBaseKg){
  if(!art) return null;
  if(art.esAluminio){
    let baseKg;
    if(overrideBaseKg!=null && overrideBaseKg>0){ baseKg = overrideBaseKg; }
    else { const base = precioAluminioActual(art.proveedorId, mesRef, CONCEPTO_BASE); if(!base) return null; baseKg = base.precioResultante; }
    let total = art.peso * baseKg;
    if(art.acabado && CONCEPTOS_ALUMINIO.includes(art.acabado) && art.acabado!==CONCEPTO_BASE){
      const recargo = recargoAcabadoActual(art.proveedorId, art.acabado, mesRef);
      if(unidadRecargoConcepto(art.acabado)==='m2'){
        if(esPerfil(art) && art.perimetro){ total += art.perimetro * recargo; }
        // sin perímetro registrado no se puede repercutir el coste de lacado por m²
      } else {
        total += art.peso * recargo;
      }
    }
    return total;
  }
  return art.precioUnitario;
}

function buildAluminioChart(){
  const todas = proveedoresExtrusionadoras();
  if(!todas.length) return '';
  const concepto = state.__chartConcepto || CONCEPTO_BASE;
  const idsSel = state.__chartProveedores || todas.map(p=>p.id);
  const provs = todas.filter(p=>idsSel.includes(p.id));
  const anio = state.__chartAnio||''; const desde = state.__chartDesde||''; const hasta = state.__chartHasta||'';
  let entries = state.preciosAluminio.filter(e=>e.concepto===concepto && provs.some(p=>p.id===e.proveedorId));
  if(anio) entries = entries.filter(e=>e.fecha.startsWith(anio));
  if(desde) entries = entries.filter(e=>e.fecha.slice(0,7)>=desde);
  if(hasta) entries = entries.filter(e=>e.fecha.slice(0,7)<=hasta);
  const months = [...new Set(entries.map(e=>e.fecha))].sort();
  if(!provs.length) return `<div class="hint">Selecciona al menos un proveedor.</div>`;
  if(months.length<2) return `<div class="hint">No hay al menos dos actualizaciones de "${esc(concepto)}" para el periodo/proveedores seleccionados.</div>`;
  const w=780,h=250,padL=48,padR=20,padT=16,padB=46;
  const innerW=w-padL-padR, innerH=h-padT-padB;
  let allVals = entries.map(x=>x.precioResultante);
  let min=Math.min(...allVals), max=Math.max(...allVals);
  if(min===max){ min-=0.1; max+=0.1; }
  const pad=(max-min)*0.15; min=Math.max(0,min-pad); max=max+pad;
  const xFor = i => padL + (months.length>1? i*(innerW/(months.length-1)) : innerW/2);
  const yFor = v => padT + innerH - ((v-min)/(max-min))*innerH;
  let grid='';
  for(let g=0; g<=3; g++){
    const val = min + (max-min)*g/3, y = yFor(val);
    grid += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${w-padR}" y2="${y.toFixed(1)}" stroke="var(--border)" stroke-width="1"/>`;
    grid += `<text x="${padL-8}" y="${(y+4).toFixed(1)}" text-anchor="end" font-size="10.5" fill="var(--text-faint)" font-family="var(--num)">${val.toFixed(2)}</text>`;
  }
  const xlabels = months.map((m,i)=>`<text x="${xFor(i).toFixed(1)}" y="${h-8}" text-anchor="middle" font-size="9.5" fill="var(--text-faint)" font-family="var(--sans)" transform="rotate(-35 ${xFor(i).toFixed(1)} ${h-8})">${fmtFecha(m)}</text>`).join('');
  let lines='';
  provs.forEach(p=>{
    const pi = todas.findIndex(x=>x.id===p.id);
    const color = CHART_COLORS[pi % CHART_COLORS.length];
    const entradas = entries.filter(x=>x.proveedorId===p.id);
    const pts = months.map((m,i)=>{ const e = entradas.find(x=>x.fecha===m); return e? {x:xFor(i), y:yFor(e.precioResultante), v:e.precioResultante} : null; }).filter(Boolean);
    if(pts.length<1) return;
    const d = pts.map((pt,i)=> (i===0?'M':'L')+pt.x.toFixed(1)+','+pt.y.toFixed(1)).join(' ');
    lines += `<path d="${d}" fill="none" stroke="${color}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>`;
    lines += pts.map(pt=>`<circle cx="${pt.x.toFixed(1)}" cy="${pt.y.toFixed(1)}" r="3.4" fill="${color}"><title>${esc(p.nombre)}: ${fmtEUR(pt.v)}/kg</title></circle>`).join('');
  });
  const legend = provs.map(p=>{ const pi = todas.findIndex(x=>x.id===p.id); return `<span style="display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-secondary);margin-right:18px;"><span style="width:9px;height:9px;border-radius:50%;background:${CHART_COLORS[pi%CHART_COLORS.length]};display:inline-block;"></span>${esc(p.nombre)}</span>`; }).join('');
  return `<div class="chart-legend">${legend}</div><svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;overflow:visible;">${grid}${lines}${xlabels}</svg>`;
}

function miniSparkline(histAsc, color){
  if(histAsc.length<2) return '';
  const w=120,h=28,pad=3;
  const vals = histAsc.map(x=>x.precioKg);
  const min=Math.min(...vals), max=Math.max(...vals), range=(max-min)||0.01;
  const pts = histAsc.map((x,i)=>{
    const px = pad + i*((w-2*pad)/(histAsc.length-1));
    const py = pad + (1-(x.precioKg-min)/range)*(h-2*pad);
    return px.toFixed(1)+','+py.toFixed(1);
  }).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:26px;display:block;margin-top:8px;"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
function buildMonthlyBarChart(){
  if(!state.presupuestos.length) return '';
  const map = {};
  state.presupuestos.forEach(p=>{ const m=(p.fecha||'').slice(0,7); if(!m) return; map[m]=(map[m]||0)+totalPresupuesto(p); });
  const months = Object.keys(map).sort();
  if(!months.length) return '';
  const last = months.slice(-6);
  const w=780,h=190,padL=56,padR=16,padT=16,padB=32;
  const innerW=w-padL-padR, innerH=h-padT-padB;
  const max = Math.max(...last.map(m=>map[m]), 1);
  const slot = innerW/last.length, bw = slot*0.5;
  let bars='', grid='';
  for(let g=0; g<=3; g++){ const val=max*g/3, y=padT+innerH-(val/max)*innerH;
    grid += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${w-padR}" y2="${y.toFixed(1)}" stroke="var(--border)" stroke-width="1"/><text x="${padL-8}" y="${(y+4).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--text-faint)" font-family="var(--num)">${val>=1000?(val/1000).toFixed(0)+'k':val.toFixed(0)}</text>`;
  }
  last.forEach((m,i)=>{
    const x = padL + i*slot + (slot-bw)/2, val = map[m], bh=(val/max)*innerH, y=padT+innerH-bh;
    bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="5" fill="var(--accent)"><title>${fmtMes(m)}: ${fmtEUR(val)}</title></rect>`;
    bars += `<text x="${(x+bw/2).toFixed(1)}" y="${h-10}" text-anchor="middle" font-size="10.5" fill="var(--text-faint)" font-family="var(--sans)">${fmtMes(m)}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;">${grid}${bars}</svg>`;
}

    {label:'Portes y otros', val:t.portesTotal+t.customTotal+t.otros, color:CHART_COLORS[3]},
  ];
  const sum = segs.reduce((s,x)=>s+x.val,0) || 1;
  const filas = segs.slice().sort((a,b)=>b.val-a.val).map(s=>{
    const pct = s.val/sum*100;
    return `<div style="margin-bottom:12px;">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;">
        <span style="font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px;"><span style="width:9px;height:9px;border-radius:2px;background:${s.color};display:inline-block;"></span>${esc(s.label)}</span>
        <span style="font-family:var(--num);font-size:12.5px;"><strong>${fmtEUR(s.val)}</strong> <span class="muted">(${fmtNum(pct,1)}%)</span></span>
      </div>
      <div style="background:var(--surface-2);border-radius:6px;height:10px;overflow:hidden;">
        <div style="width:${pct.toFixed(2)}%;height:100%;background:${s.color};"></div>
      </div>
    </div>`;
  }).join('');
  return `<div>${filas}</div>`;
}

/* ================= SHELL ================= */
function render(){
  const activeEl = document.activeElement;
  const activeId = (activeEl && activeEl.id) ? activeEl.id : null;
  let selStart=null, selEnd=null;
  if(activeId && (activeEl.tagName==='INPUT'||activeEl.tagName==='TEXTAREA') && typeof activeEl.selectionStart==='number'){
    selStart = activeEl.selectionStart; selEnd = activeEl.selectionEnd;
  }
  const nav = document.getElementById('nav');
  nav.innerHTML = `<div class="nav-eyebrow">Menú</div>` + TABS.map(t=>`
    <div class="nav-item ${state.tab===t.id?'active':''}" onclick="setTab('${t.id}')">
      ${ICONS[t.id]}<span>${t.label}</span>
    </div>`).join('');
  const main = document.getElementById('main');
  let html;
  if(state.tab==='dashboard') html = renderDashboard();
  else if(state.tab==='presupuestos') html = state.builder ? renderBuilder() : renderPresupuestos();
  else if(state.tab==='obras') html = state.obraDetailId ? renderObraDetail(state.obraDetailId) : renderObrasModule();
  else if(state.tab==='pedidos') html = renderPedidosModule();
  else if(state.tab==='stock') html = renderStockModule();
  else if(state.tab==='personal') html = state.trabajadorDetailId ? renderTrabajadorDetail(state.trabajadorDetailId) : renderPersonalModule();
  else if(state.tab==='catalogo') html = state.catalogoDetailId ? renderArticuloDetail(state.catalogoDetailId) : renderCatalogo();
  else if(state.tab==='proveedores') html = renderProveedores();
  else if(state.tab==='aluminio') html = renderAluminio();
  else if(state.tab==='clientes') html = state.clienteDetailId ? renderClienteDetail(state.clienteDetailId) : renderClientes();
  else if(state.tab==='configuracion') html = renderConfiguracion();
  main.style.paddingBottom = state.tab==='dashboard' ? '16px' : '';
  main.innerHTML = `<div class="view-fade">${html}</div>`;
  document.getElementById('modal-root').innerHTML = renderModalRoot();
  if(activeId){
    const el = document.getElementById(activeId);
    if(el && (el.tagName==='INPUT'||el.tagName==='TEXTAREA'||el.tagName==='SELECT')){
      el.focus();
      if(selStart!==null && el.setSelectionRange){ try{ el.setSelectionRange(selStart, selEnd); }catch(e){} }
    }
  }
}

/* ---- shared media (image + documents) for articles and providers ---- */
function normalizeArticuloMedia(media){
  const m = media || {};
  if(m.imagen && !m.imagenes){ m.imagenes = [m.imagen]; }
  m.imagenes = m.imagenes || [];
  m.documentos = m.documentos || [];
  delete m.imagen;
  return m;
}
async function ensureArticuloMediaLoaded(id){
  if(state.catalogoMedia[id]!==undefined) return state.catalogoMedia[id];
  try{ const r = await window.storage.get('articulo_media:'+id, false); state.catalogoMedia[id] = normalizeArticuloMedia(r&&r.value? JSON.parse(r.value) : null); }
  catch(e){ state.catalogoMedia[id] = {imagenes:[], documentos:[]}; }
  render();
  return state.catalogoMedia[id];
}
async function ensureProveedorMediaLoaded(id){
  if(state.proveedorMedia[id]!==undefined) return state.proveedorMedia[id];
  try{ const r = await window.storage.get('proveedor_media:'+id, false); state.proveedorMedia[id] = r&&r.value? JSON.parse(r.value) : {imagen:null, documentos:[]}; }
  catch(e){ state.proveedorMedia[id] = {imagen:null, documentos:[]}; }
  render();
  return state.proveedorMedia[id];
}
async function ensureClienteMediaLoaded(id){
  if(state.clienteMedia[id]!==undefined) return state.clienteMedia[id];

function modalRecortarFoto(){

  return `<h3>Ajustar foto</h3>
    <div class="modal-sub">Arrastra para mover la imagen y usa el deslizador para ampliar o reducir. ${esObra? 'Se guardará en formato panorámico.' : 'Se guardará encuadrada en círculo.'}</div>
    <div style="width:100%;height:320px;overflow:hidden;background:#111;border-radius:10px;">

function iniciarCropper(panoramica){
  if(window.__cropper){ try{ window.__cropper.destroy(); }catch(e){} window.__cropper=null; }
  const img = document.getElementById('crop-img');
  if(!img || typeof Cropper==='undefined') return;
  window.__cropper = new Cropper(img, {
    aspectRatio: panoramica? 16/9 : 1,
    viewMode: 1,
    dragMode: 'move',
    background: false,
    autoCropArea: 1,
    guides: false,
    center: false,
    highlight: false,
    cropBoxMovable: false,
    cropBoxResizable: false,
    toggleDragModeOnDblclick: false,
    ready(){ document.getElementById('crop-zoom').value = 1; }
  });
}
window.iniciarCropper = iniciarCropper;
async function confirmarRecorteFoto(){
  if(!window.__cropper){ toast('La imagen todavía se está cargando, espera un segundo.', true); return; }
  const extra = state.modal.extra || {};
  const esObra = extra.tipo==='obra';
  const canvas = window.__cropper.getCroppedCanvas(esObra? {width:800, height:450, imageSmoothingQuality:'high'} : {width:500, height:500, imageSmoothingQuality:'high'});
  if(!canvas) return;
  const dataUrl = canvas.toDataURL('image/jpeg', 0.88);
  await guardarFotoTrasRecorte(extra.tipo, extra.entidadId, dataUrl);
}
window.confirmarRecorteFoto = confirmarRecorteFoto;
async function guardarFotoTrasRecorte(tipo, id, dataUrl){
  const mapaEstado = {trabajador:state.trabajadorMedia, proveedor:state.proveedorMedia, cliente:state.clienteMedia, obra:state.obraMedia};
  const mapaKey = {trabajador:'trabajador_media:', proveedor:'proveedor_media:', cliente:'cliente_media:', obra:'obra_media:'};
  const store = mapaEstado[tipo]; const keyPrefix = mapaKey[tipo];
  if(!store || !keyPrefix){ toast('No se pudo guardar la foto', true); return; }
  const media = store[id] || {imagen:null, documentos:[]};
  media.imagen = {nombre:'foto.jpg', dataUrl, fecha: todayISO()};
  store[id] = media;
  await persistRaw(keyPrefix+id, media);
  toast('Foto guardada');
  if(window.__cropper){ try{ window.__cropper.destroy(); }catch(e){} window.__cropper=null; }
  closeModal();
}

  const imgRemoveHandler = editId? (kind==='proveedor'?`eliminarProveedorImagen('${editId}')`:`eliminarClienteImagen('${editId}')`) : `stagedRemoveImagen()`;
  let html = eyebrow(title) + `<div class="row" style="align-items:flex-start;"><div class="field">

    ${imagen? ` <button type="button" class="btn btn-sm" onclick="${imgRemoveHandler}">Quitar</button>` : ''}
  </div>`;
  if(kind==='proveedor'){
    const docInputHandler = editId? `handleProveedorDocumentoChange('${editId}', this)` : `stagedHandleDocumentoChange(this)`;
    html += `<div class="field">

    </div>`;
  }
  html += `</div>`;
  return html;
}

  };

  return `

async function aplicarActualizacionCatalogoProveedor(){
  const pct = parseFloat(document.getElementById('cp-pct').value);
  if(isNaN(pct) || pct===0){ toast('Indica un porcentaje distinto de 0', true); return; }
  const motivo = document.getElementById('cp-motivo').value.trim();
  const proveedorId = state.modal.extra.proveedorId;
  let count=0;
  state.catalogo.forEach(a=>{
    if(a.proveedorId===proveedorId && !a.esAluminio && a.precioUnitario!=null){
      const nuevo = Math.round(a.precioUnitario*(1+pct/100)*100)/100;
      a.precioHistorial = a.precioHistorial || [];
      a.precioHistorial.push({fecha: todayISO(), precio: nuevo, motivo: motivo || (pct>0? ('Subida catálogo +'+pct+'%') : ('Bajada catálogo '+pct+'%'))});
      a.precioUnitario = nuevo;
      count++;
    }
  });
  if(!count){ toast('Este proveedor no tiene artículos de precio fijo', true); return; }
  await persist('catalogo');
  toast(count+' artículo(s) actualizados');
  closeModal();
}
window.aplicarActualizacionCatalogoProveedor = aplicarActualizacionCatalogoProveedor;

async function saveArticulo(){
  const nombre = document.getElementById('ar-nombre').value.trim();
  if(!nombre){ toast('Indica el nombre del artículo', true); return; }
  const esAluminio = document.getElementById('ar-esal').checked;
  const data = {
    proveedorId: document.getElementById('ar-proveedor').value, tipo: document.getElementById('ar-tipo').value,
    nombre, referencia: document.getElementById('ar-ref').value.trim(), esAluminio,
    referenciaPropia: document.getElementById('ar-refpropia').value.trim(),
    acabado: document.getElementById('ar-acabado').value,
    acabadoDetalle: document.getElementById('ar-acabadodetalle').value.trim(),
    peso: esAluminio? (parseFloat(document.getElementById('ar-peso').value)||0) : null,
    perimetro: (esAluminio && document.getElementById('ar-tipo').value==='Perfilería') ? (parseFloat(document.getElementById('ar-perimetro').value)||0) : null,
    precioUnitario: !esAluminio? (parseFloat(document.getElementById('ar-precio').value)||0) : null,
    empaquetadoTipo: document.getElementById('ar-emptipo').value,
    empaquetadoCantidad: parseInt(document.getElementById('ar-empcantidad').value,10) || null,
    empaquetadoNota: document.getElementById('ar-empnota').value.trim(),
  };
  const m = state.modal; let newId = m.editId;
  if(m.editId){
    const i = state.catalogo.findIndex(a=>a.id===m.editId);
    const prev = state.catalogo[i];
    if(!esAluminio && data.precioUnitario!=null && prev.precioUnitario!=null && data.precioUnitario!==prev.precioUnitario){
      data.precioHistorial = [...(prev.precioHistorial||[]), {fecha: todayISO(), precio: data.precioUnitario, motivo:'Edición manual'}];
    }
    state.catalogo[i] = {...prev, ...data};
  }
  else {
    newId = uid(); state.catalogo.push({id:newId, ...data});
    if((m.stagedImagenes&&m.stagedImagenes.length) || (m.stagedDocumentos&&m.stagedDocumentos.length)){
      const media = {imagenes: m.stagedImagenes||[], documentos: m.stagedDocumentos||[]};
      state.catalogoMedia[newId] = media;
      await persistRaw('articulo_media:'+newId, media);
    }
  }
  await persist('catalogo');
  if(data.referenciaPropia && state.catalogo.some(a=>a.id!==newId && a.referenciaPropia===data.referenciaPropia)){
    toast('Guardado, pero ojo: hay otro artículo con la misma referencia propia ('+data.referenciaPropia+').', true);
  } else {
    toast('Artículo guardado');
  }
  const cb = m.onCreated; closeModal(); if(cb) cb(newId); else render();
}
window.saveArticulo = saveArticulo;
function presupuestosQueUsanArticulo(id){
  return state.presupuestos.filter(p=>(p.partidas||[]).some(pt=>

    || (pt.items||[]).some(it=> it.tipo!=='texto' && it.articuloId===id) // por si quedara algún dato muy antiguo sin migrar
  ));
}

async function deleteArticulo(id){
  const usados = presupuestosQueUsanArticulo(id);
  if(usados.length){
    const nombres = usados.map(p=>'"'+(p.proyecto||'Presupuesto sin nombre')+'" (v'+(p.version||1)+')').join(', ');
    toast('No se puede eliminar: está usado en '+nombres+'. Quítalo de esas partidas primero.', true);
    return;
  }
  if(!confirm('¿Eliminar este artículo del catálogo? También se eliminarán su imagen y documentos adjuntos.')) return;
  state.catalogo = state.catalogo.filter(a=>a.id!==id);
  await persist('catalogo');

  delete state.catalogoMedia[id];
  if(state.catalogoDetailId===id) state.catalogoDetailId=null;
  toast('Artículo eliminado'); render();
}

function contactoPrincipal(p){
  if(p.contactos && p.contactos.length) return p.contactos[0];
  if(p.contacto||p.telefono||p.email) return {nombre:p.contacto||'', telefono:p.telefono||'', email:p.email||''};
  return null;
}
const __mediaLoadingSet = new Set();
function preloadMediaList(items, mediaMap, ensureFn){
  items.forEach(it=>{
    if(mediaMap[it.id]===undefined && !__mediaLoadingSet.has(it.id)){
      __mediaLoadingSet.add(it.id);
      ensureFn(it.id).finally(()=>__mediaLoadingSet.delete(it.id));
    }
  });
}
function avatarHtml(media, nombre, size){
  size = size||34;
  if(media && media.imagen) return `<img src="${media.imagen.dataUrl}" style="width:${size}px;height:${size}px;border-radius:50%;object-fit:cover;border:1px solid var(--border);flex:0 0 auto;">`;
  const initials = (nombre||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase() || '?';
  return `<div style="width:${size}px;height:${size}px;border-radius:50%;background:var(--surface-3);color:var(--text-secondary);display:inline-flex;align-items:center;justify-content:center;font-size:${Math.round(size*0.38)}px;font-weight:700;border:1px solid var(--border);flex:0 0 auto;">${esc(initials)}</div>`;
}

function renderAluminio(){
  const extrusionadoras = proveedoresExtrusionadoras();
  let html = sectionHead('aluminio','Precio del aluminio','Actualizaciones de precio por proveedor y concepto', extrusionadoras.length? `<button class="btn btn-primary" onclick="abrirNuevaActualizacionAluminio()">${ICON_PLUS}Nueva actualización</button>` : '');
  if(!state.proveedores.length){
    html += `<div class="card"><div class="empty">${ICON_EMPTY}<div>Da de alta al menos un proveedor primero.</div><button class="btn btn-sm" onclick="seedExampleData()">Cargar datos de ejemplo</button></div></div>`;
    return html;
  }
  if(!extrusionadoras.length){
    html += `<div class="card"><div class="empty">${ICON_EMPTY}<div>Marca al menos un proveedor como "extrusionadora" (en su ficha) para poder registrar actualizaciones de precio del aluminio.</div></div></div>`;
    return html;
  }

  const kpis = extrusionadoras.map((p,pi)=>{
    const ult = precioAluminioActual(p.id, null, CONCEPTO_BASE);
    const hist = state.preciosAluminio.filter(x=>x.proveedorId===p.id && x.concepto===CONCEPTO_BASE).sort((a,b)=>a.fecha.localeCompare(b.fecha));
    let trend = '';
    if(hist.length>1){
      const diff = hist[hist.length-1].precioResultante - hist[hist.length-2].precioResultante;
      trend = diff>0? `<span style="color:var(--danger)">▲ ${fmtNum(Math.abs(diff),2)}</span>` : diff<0? `<span style="color:var(--ok)">▼ ${fmtNum(Math.abs(diff),2)}</span>` : `<span class="muted">sin cambio</span>`;
    }
    return `<div class="kpi" onclick="state.aluminioProveedorSel='${p.id}'; render(); document.getElementById('hist-detallado')?.scrollIntoView({behavior:'smooth',block:'start'});" style="cursor:pointer;" title="Ver histórico de ${esc(p.nombre)}">
      <div class="lbl">${esc(p.nombre)}</div><div class="val">${ult? fmtEUR(ult.precioResultante)+'/kg':'—'}</div><div class="foot">${ult?fmtFecha(ult.fecha):'sin datos'} ${trend? '· '+trend:''}</div>${miniSparkline(hist.map(h=>({precioKg:h.precioResultante})), CHART_COLORS[pi%CHART_COLORS.length])}
      <div class="hint" style="margin-top:8px;margin-bottom:-2px;">Ver histórico →</div>
    </div>`;
  }).join('');
  html += `<div class="kpi-grid">${kpis}</div>`;

  const chart = buildAluminioChart();
  html += `<div class="card"><h3>Gráfica comparativa</h3>${aluminioChartFiltrosHtml(extrusionadoras)}<div style="margin-top:14px;">${chart}</div></div>`;

  if(state.aluminioProveedorSel && extrusionadoras.some(p=>p.id===state.aluminioProveedorSel)){
    const sel = state.aluminioProveedorSel;
    const selConcepto = state.aluminioConceptoSel || '';
    const entradas = state.preciosAluminio.filter(p=>p.proveedorId===sel && (!selConcepto || p.concepto===selConcepto)).sort((a,b)=>b.fecha.localeCompare(a.fecha));
    const rows = entradas.map(e=>{
      let variacion;
      if(e.direccion==='base') variacion = `<span style="color:var(--accent-text)">● Precio base</span>`;
      else if(e.direccion==='bajada') variacion = `<span style="color:var(--ok)">▼ Bajada</span> ${fmtEUR(e.valor)}`;
      else variacion = `<span style="color:var(--danger)">▲ Subida</span> ${fmtEUR(e.valor)}`;
      return `<tr>
        <td>${fmtFecha(e.fecha)}</td>
        <td>${e.concepto===CONCEPTO_BASE? `<span class="tag">${esc(e.concepto)}</span>` : `<span class="tag tag-accent">${esc(e.concepto)}</span>`}</td>
        <td>${variacion}</td>
        <td class="num">${fmtEUR(e.precioResultante)}</td>
        <td class="no-print" style="text-align:right;"><button class="icon-btn" onclick="deletePrecioAluminio('${e.id}')" title="Eliminar">${ICON_TRASH}</button></td>
      </tr>`;
    }).join('');
    html += `<div class="card" id="hist-detallado">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;">
          <h3 style="border-bottom:none;padding-bottom:0;margin-bottom:0;">Histórico — ${esc(nombreProveedor(sel))}</h3>
          <button class="btn btn-sm no-print" onclick="state.aluminioProveedorSel=null; render();">Ocultar</button>
        </div>
        <div class="row" style="max-width:420px;margin:14px 0;">
          <div class="field"><label>Proveedor</label>
            <select onchange="state.aluminioProveedorSel=this.value; render();">${extrusionadoras.map(p=>`<option value="${p.id}" ${p.id===sel?'selected':''}>${esc(p.nombre)}</option>`).join('')}</select>
          </div>
          <div class="field"><label>Concepto</label>
            <select onchange="state.aluminioConceptoSel=this.value; render();">
              <option value="" ${!selConcepto?'selected':''}>Todos</option>
              ${CONCEPTOS_ALUMINIO.map(c=>`<option value="${esc(c)}" ${c===selConcepto?'selected':''}>${esc(c)}</option>`).join('')}
            </select>
          </div>
        </div>
        ${entradas.length? `<table><thead><tr><th>Fecha</th><th>Concepto</th><th>Variación</th><th style="text-align:right">Precio resultante</th><th></th></tr></thead><tbody>${rows}</tbody></table>`
        : `<div class="empty">${ICON_EMPTY}<div>Sin actualizaciones registradas para este proveedor.</div></div>`}
      </div>`;
  }
  return html;
}
function abrirNuevaActualizacionAluminio(){ openModal('actualizacionAluminio'); }
window.abrirNuevaActualizacionAluminio = abrirNuevaActualizacionAluminio;
function modalActualizacionAluminio(){
  const extrusionadoras = proveedoresExtrusionadoras();
  const updFecha = state.__updFecha || todayISO();
  const updProveedor = state.__updProveedor && extrusionadoras.some(p=>p.id===state.__updProveedor) ? state.__updProveedor : extrusionadoras[0].id;
  const updConcepto = state.__updConcepto || CONCEPTO_BASE;
  const updDireccion = state.__updDireccion || 'subida';
  const baseAntes = precioAluminioActual(updProveedor, null, updConcepto);
  const updTipo = state.__updTipo || 'movimiento';
  const unidad = unidadRecargoConcepto(updConcepto)==='m2' ? '€/m²' : '€/kg';
  return `
    <h3>Nueva actualización de precio</h3>
    <div class="modal-sub">Indica proveedor, concepto y la fecha exacta — puedes registrar más de una actualización dentro del mismo mes si hace falta.</div>
    <div class="row">
      <div class="field"><label>Proveedor (extrusionadora)</label>
        <select onchange="state.__updProveedor=this.value; refreshModalActualizacionAluminio();" id="upd-proveedor">${extrusionadoras.map(p=>`<option value="${p.id}" ${p.id===updProveedor?'selected':''}>${esc(p.nombre)}</option>`).join('')}</select>
      </div>
      <div class="field"><label>Concepto</label>
        <select onchange="state.__updConcepto=this.value; refreshModalActualizacionAluminio();" id="upd-concepto">${CONCEPTOS_ALUMINIO.map(c=>`<option value="${esc(c)}" ${c===updConcepto?'selected':''}>${esc(c)}${c===CONCEPTO_BASE?' (base, €/kg)':(unidadRecargoConcepto(c)==='m2'?' (recargo, €/m²)':' (recargo, €/kg)')}</option>`).join('')}</select>
      </div>
    </div>
    <div class="row">
      <div class="field"><label>Fecha</label><input type="date" id="upd-fecha" value="${updFecha}" onchange="state.__updFecha=this.value;"></div>
      <div class="field"><label>Tipo de entrada</label>
        <select id="upd-tipo" onchange="state.__updTipo=this.value; toggleTipoActualizacionAluminio();">
          <option value="movimiento" ${updTipo==='movimiento'?'selected':''}>Subida / bajada</option>
          <option value="base" ${updTipo==='base'?'selected':''}>Fijar precio base</option>
        </select>
      </div>
    </div>
    <div class="row" id="upd-movimiento-row" style="${updTipo==='base'?'display:none;':''}">
      <div class="field"><label>Variación</label>
        <select id="upd-direccion" onchange="state.__updDireccion=this.value;">
          <option value="subida" ${updDireccion==='subida'?'selected':''}>Subida</option>
          <option value="bajada" ${updDireccion==='bajada'?'selected':''}>Bajada</option>
        </select>
      </div>
      <div class="field"><label id="upd-valor-label">Importe (${unidad})</label><input type="number" step="0.01" min="0" id="upd-valor" placeholder="0.05"></div>
    </div>
    <div class="field" id="upd-base-row" style="${updTipo==='base'?'':'display:none;'}">
      <label id="upd-baseprecio-label">Precio base (${unidad})</label><input type="number" step="0.01" min="0" id="upd-baseprecio" placeholder="2.60">
      <div class="hint">Fija el precio de partida desde esa fecha en adelante. Las subidas/bajadas posteriores se calcularán a partir de este valor.</div>
    </div>
    <div class="hint" id="upd-hint">Precio actual de "${esc(updConcepto)}" para ${esc(nombreProveedor(updProveedor))}: <strong>${baseAntes? fmtEUR(baseAntes.precioResultante)+'/'+(unidad==='€/m²'?'m²':'kg'):'sin histórico (se tomará como 0)'}</strong>.</div>
    <div class="modal-foot"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="addActualizacionAluminio()">Añadir</button></div>`;
}
function toggleTipoActualizacionAluminio(){
  const esBase = document.getElementById('upd-tipo').value==='base';
  document.getElementById('upd-movimiento-row').style.display = esBase? 'none' : '';
  document.getElementById('upd-base-row').style.display = esBase? '' : 'none';
}
window.toggleTipoActualizacionAluminio = toggleTipoActualizacionAluminio;
function refreshModalActualizacionAluminio(){
  const proveedorId = document.getElementById('upd-proveedor').value;
  const concepto = document.getElementById('upd-concepto').value;
  const baseAntes = precioAluminioActual(proveedorId, null, concepto);
  const unidad = unidadRecargoConcepto(concepto)==='m2' ? '€/m²' : '€/kg';
  document.getElementById('upd-hint').innerHTML = `Precio actual de "${esc(concepto)}" para ${esc(nombreProveedor(proveedorId))}: <strong>${baseAntes? fmtEUR(baseAntes.precioResultante)+'/'+(unidad==='€/m²'?'m²':'kg'):'sin histórico (se tomará como 0)'}</strong>.`;
  const vl = document.getElementById('upd-valor-label'); if(vl) vl.textContent = 'Importe ('+unidad+')';
  const bl = document.getElementById('upd-baseprecio-label'); if(bl) bl.textContent = 'Precio base ('+unidad+')';
}
window.refreshModalActualizacionAluminio = refreshModalActualizacionAluminio;
async function addActualizacionAluminio(){
  const fecha = document.getElementById('upd-fecha').value;
  const proveedorId = document.getElementById('upd-proveedor').value;
  const concepto = document.getElementById('upd-concepto').value || CONCEPTO_BASE;
  const esBase = document.getElementById('upd-tipo').value==='base';
  if(!fecha){ toast('Selecciona una fecha', true); return; }
  let entry;
  if(esBase){
    const valor = parseFloat(document.getElementById('upd-baseprecio').value);
    if(isNaN(valor) || valor<=0){ toast('Indica un precio base válido', true); return; }
    entry = {id:uid(), proveedorId, concepto, fecha, direccion:'base', valor};
  } else {
    const valor = parseFloat(document.getElementById('upd-valor').value);
    const direccion = document.getElementById('upd-direccion').value || 'subida';
    if(isNaN(valor) || valor<=0){ toast('Indica un importe válido', true); return; }
    entry = {id:uid(), proveedorId, concepto, fecha, direccion, valor};
  }
  state.preciosAluminio = state.preciosAluminio.filter(x=>!(x.proveedorId===proveedorId && x.concepto===concepto && x.fecha===fecha));
  state.preciosAluminio.push(entry);
  recalcAluminioCascade(proveedorId, concepto);
  await persist('preciosAluminio');
  state.aluminioProveedorSel = proveedorId;
  state.aluminioConceptoSel = concepto;
  toast('Actualización añadida');
  closeModal();
}
window.addActualizacionAluminio = addActualizacionAluminio;
async function deletePrecioAluminio(entryId){
  const e = state.preciosAluminio.find(x=>x.id===entryId);
  if(!e) return;
  state.preciosAluminio = state.preciosAluminio.filter(x=>x.id!==entryId);
  recalcAluminioCascade(e.proveedorId, e.concepto);
  await persist('preciosAluminio');
  toast('Actualización eliminada'); render();
}
window.deletePrecioAluminio = deletePrecioAluminio;

/* ================= CATALOGO ================= */
function toggleCatalogoSort(field){
  if(state.catalogoSort.field===field){ state.catalogoSort.dir = state.catalogoSort.dir==='asc'?'desc':'asc'; }
  else { state.catalogoSort = {field, dir: field==='precio'?'asc':'asc'}; }
  render();
}
window.toggleCatalogoSort = toggleCatalogoSort;
function sortArrow(field){
  if(state.catalogoSort.field!==field) return '';
  return state.catalogoSort.dir==='asc' ? ' ↑' : ' ↓';
}
function sortableTh(field, label, alignRight){
  return `<th onclick="toggleCatalogoSort('${field}')" style="cursor:pointer;user-select:none;${alignRight?'text-align:right;':''}" title="Ordenar">${label}${sortArrow(field)}</th>`;
}
function renderCatalogo(){
  const f = state.catalogoFilter;
  const q = (f.q||'').trim().toLowerCase();
  let items = state.catalogo.filter(a=>
    (!f.proveedor || a.proveedorId===f.proveedor) && (!f.tipo || a.tipo===f.tipo) &&
    (!q || [a.nombre, a.referencia, a.referenciaPropia, a.tipo, a.acabado, a.acabadoDetalle, nombreProveedor(a.proveedorId)].filter(Boolean).some(v=>v.toLowerCase().includes(q))));
  const sf = state.catalogoSort.field, sd = state.catalogoSort.dir==='asc'?1:-1;
  if(sf==='nombre'){ items = [...items].sort((a,b)=>sd*a.nombre.localeCompare(b.nombre)); }
  else if(sf==='proveedor'){ items = [...items].sort((a,b)=>sd*nombreProveedor(a.proveedorId).localeCompare(nombreProveedor(b.proveedorId))); }
  else if(sf==='precio'){
    items = [...items].sort((a,b)=>{
      const pa = precioEfectivoArticulo(a,null), pb = precioEfectivoArticulo(b,null);
      if(pa===null && pb===null) return 0;
      if(pa===null) return 1;
      if(pb===null) return -1;
      return sd*(pa-pb);
    });
  }
  const rows = items.map(a=>{
    const precio = precioEfectivoArticulo(a, null);
    return `<tr>
      <td><a href="#" onclick="openArticuloDetail('${a.id}'); return false;" style="color:var(--text-primary);font-weight:500;text-decoration:none;">${esc(a.nombre)}</a>${a.referenciaPropia?`<div class="muted" style="font-size:11px;">${esc(a.referenciaPropia)}</div>`:''}</td>
      <td>${tipoTag(a.tipo)}</td>
      <td class="muted">${esc(acabadoDisplay(a))}</td>
      <td class="muted"><a href="#" onclick="state.catalogoFilter.proveedor='${a.proveedorId}'; render(); return false;" style="color:var(--text-secondary);text-decoration:none;" title="Filtrar por este proveedor">${esc(nombreProveedor(a.proveedorId))}</a>${a.referencia?`<div class="muted" style="font-size:11px;">${esc(a.referencia)}</div>`:''}</td>
      <td class="num">${a.esAluminio? fmtNum(a.peso,3)+' '+unidadPeso(a):'—'}</td>
      <td class="num">${a.esAluminio? `<span class="tag tag-accent">por kg</span>` : fmtEUR(a.precioUnitario)}</td>
      <td class="num"><strong>${precio===null? '<span class="muted">sin precio Al.</span>' : fmtEUR(precio)}</strong></td>
      <td class="no-print" style="text-align:right;position:relative;">
        <button class="icon-btn edit" onclick="toggleMenuArticulo('${a.id}')" title="Más opciones">${ICON_DOTS}</button>
        ${state.__openMenuArticulo===a.id? `<div class="dropdown-menu" onclick="event.stopPropagation()">
          <div class="dropdown-item" onclick="openArticuloDetail('${a.id}')">${ICONS.catalogo}Ver ficha</div>
          <div class="dropdown-item" onclick="editArticulo('${a.id}')">${ICON_EDIT}Editar</div>
          <div class="dropdown-item danger" onclick="deleteArticulo('${a.id}')">${ICON_TRASH}Eliminar</div>
        </div>` : ''}
      </td>
    </tr>`;
  }).join('');
  let html = sectionHead('catalogo','Catálogo','Perfilería, escuadras, tornillería, anclajes y demás artículos por proveedor', `<button class="btn btn-primary" onclick="openModal('articulo')" ${state.proveedores.length?'':'disabled'}>${ICON_PLUS}Nuevo artículo</button>`, state.catalogo.length);
  html += !state.proveedores.length? `<div class="card"><div class="empty">${ICON_EMPTY}<div>Da de alta un proveedor antes de crear artículos de catálogo.</div><button class="btn btn-sm" onclick="seedExampleData()">Cargar datos de ejemplo</button></div></div>` : '';
  html += `<div class="card">`;
  if(state.catalogo.length){
    html += `<div class="card-tools">
      <div class="field"><label>Proveedor</label><select onchange="state.catalogoFilter.proveedor=this.value; render();">
        <option value="">Todos</option>${state.proveedores.map(p=>`<option value="${p.id}" ${f.proveedor===p.id?'selected':''}>${esc(p.nombre)}</option>`).join('')}
      </select></div>
      <div class="field"><label>Tipo</label><select onchange="state.catalogoFilter.tipo=this.value; render();">
        <option value="">Todos</option>${getTiposArticulo().map(t=>`<option ${f.tipo===t?'selected':''}>${t}</option>`).join('')}
      </select></div>
      <div class="field" style="flex:2;"><label>Buscar</label><input id="cat-search-input" value="${esc(f.q)}" placeholder="Nombre, referencia, acabado, proveedor…" oninput="state.catalogoFilter.q=this.value; render();"></div>
    </div>
    <div class="hint" style="margin-bottom:10px;">Toca "Artículo", "Proveedor" o "Precio actual" para ordenar.</div>`;
    html += items.length ? `<table><thead><tr>${sortableTh('nombre','Artículo')}<th>Tipo</th><th>Acabado</th>${sortableTh('proveedor','Proveedor')}<th>Peso</th><th>Precio unit.</th>${sortableTh('precio','Precio actual',true)}<th></th></tr></thead><tbody>${rows}</tbody></table>`
      : `<div class="empty">${ICON_EMPTY}<div>Ningún artículo coincide con el filtro.</div></div>`;
  } else {
    html += `<div class="empty">${ICON_EMPTY}<div>Sin artículos en el catálogo todavía.</div></div>`;
  }
  html += `</div>`;
  if(state.__openMenuArticulo) html += `<div class="menu-backdrop" onclick="state.__openMenuArticulo=null; render();"></div>`;
  return html;
}

  await ensureArticuloMediaLoaded(id);
}

  let html = `<div class="topbar">

            <button type="button" class="no-print thumb-x" title="Quitar" onclick="event.stopPropagation(); eliminarArticuloImagen('${a.id}','${im.id}')">✕</button>
          </div>`).join('')}
        <label class="btn btn-sm no-print" style="cursor:pointer;height:46px;width:46px;flex-direction:column;gap:2px;border-style:dashed;padding:0;">${ICON_PLUS}<input type="file" accept="image/*" multiple style="display:none;" onchange="handleArticuloImagenAdd('${a.id}', this)"></label>

      </div>

  }

  const docs = (media && media.documentos) || [];
  const docsCard = `<div class="card">
    <h3>Fichas técnicas y documentos</h3>
    ${cargando? `<div class="empty" style="padding:24px;">Cargando…</div>` : (docs.length? `<table><tbody>${docs.map(d=>`
      <tr>

async function guardarPrecioCompra(){
  const articuloId = state.modal.extra.articuloId;
  const i = state.catalogo.findIndex(x=>x.id===articuloId);
  if(i<0) return;
  const a = state.catalogo[i];
  const fecha = document.getElementById('pc-fecha').value;
  const precio = parseFloat(document.getElementById('pc-precio').value);
  const ref = document.getElementById('pc-ref').value.trim();
  if(!fecha){ toast('Indica la fecha', true); return; }
  if(isNaN(precio) || precio<=0){ toast('Indica un precio válido', true); return; }
  const precioCatalogo = precioEfectivoArticulo(a, fecha.slice(0,7));
  let desviacionPct = null;
  if(precioCatalogo!=null && precioCatalogo>0) desviacionPct = Math.round(((precio-precioCatalogo)/precioCatalogo)*1000)/10;
  a.precioHistorial = a.precioHistorial || [];
  a.precioHistorial.push({fecha, precio, motivo: ref || 'Compra registrada', origen:'compra', precioCatalogo, desviacionPct});
  await persist('catalogo');
  if(desviacionPct!==null && Math.abs(desviacionPct)>=2){
    toast('⚠ Difiere un '+(desviacionPct>0?'+':'')+fmtNum(desviacionPct,1)+'% del precio de catálogo', true);
  } else {
    toast('Precio de compra registrado');
  }
  closeModal();
}

function isoWeekNumber(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  d.setDate(d.getDate() + 4 - (d.getDay()||7));
  const yearStart = new Date(d.getFullYear(),0,1);
  return Math.ceil((((d-yearStart)/86400000)+1)/7);
}
function addDiasISO(dateStr, n){ const d=new Date(dateStr+'T00:00:00'); d.setDate(d.getDate()+n); return fechaLocalISO(d); }
function addMesesISO(mesStr, n){ const [y,m]=mesStr.split('-').map(Number); const d=new Date(y, m-1+n, 1); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function getCategoriasEvento(){ return (state.categoriasEventoConfig && state.categoriasEventoConfig.length) ? state.categoriasEventoConfig : CATEGORIAS_EVENTO_DEFAULT; }
function categoriaEvento(id){ return getCategoriasEvento().find(c=>c.id===id) || getCategoriasEvento()[getCategoriasEvento().length-1]; }

function getNotificacionesPendientes(){
  const hoy = todayISO();
  const puesto = state.miPuesto || '';
  const cfg = (puesto && state.configNotificaciones[puesto]) || null;
  const list = [];
  state.eventos.forEach(ev=>{
    if(!ev.notificar || !ev.notificar.activo || ev.notifLeida) return;
    if(ev.fecha > hoy) return;
    if(puesto && ev.notificar.puestos && ev.notificar.puestos.length && !ev.notificar.puestos.includes(puesto)) return;
    if(cfg && cfg.categorias && !cfg.categorias.includes(ev.categoriaId)) return;
    const cat = categoriaEvento(ev.categoriaId);
    list.push({id:'evento:'+ev.id, tipo:cat.nombre, titulo:ev.titulo, fecha:ev.fecha, color:cat.color, marcar:`marcarEventoLeido('${ev.id}')`});
  });
  state.presupuestos.forEach(p=>{
    if(seguimientoPendiente(p) && !p.seguimientoLeido){
      if(cfg && cfg.seguimiento===false) return;
      list.push({id:'seguimiento:'+p.id, tipo:'Seguimiento', titulo:'Seguimiento: '+(p.proyecto||'presupuesto'), fecha:p.fechaSeguimiento, color:'#C22E2E', marcar:`marcarSeguimientoLeido('${p.id}')`});
    }
  });
  return list.sort((a,b)=>a.fecha.localeCompare(b.fecha));
}

}

async function guardarEvento(id){
  const titulo = document.getElementById('ev-titulo').value.trim();

  const puestosSel = Array.from(document.querySelectorAll('.ev-notif-puesto:checked')).map(el=>el.value);
  const data = {

}

  const diasEnMes = new Date(anio, mesN, 0).getDate();
  const totalCeldas = Math.ceil((diaSemanaPrimer+diasEnMes)/7)*7;
  const meses = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const mesesCortos = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  const hoy = todayISO();
  let semanasHtml = '';
  for(let w=0; w<totalCeldas/7; w++){
    const semanaInicio = addDiasISO(inicioGrid, w*7);
    semanasHtml += `<div class="cal-week-num">${isoWeekNumber(semanaInicio)}</div>`;
    for(let d=0; d<7; d++){
      const fecha = addDiasISO(inicioGrid, w*7+d);
      const enMes = fecha.slice(0,7)===state.calMes;
      const evs = state.eventos.filter(e=>e.fecha===fecha);
      const evsHtml = compacto
        ? (evs.length? `<div class="cal-day-dots">${evs.slice(0,4).map(e=>{ const c=categoriaEvento(e.categoriaId); return `<span class="cal-dot" style="background:${c.color};" title="${esc(e.titulo)}" onclick="event.stopPropagation(); editarEvento('${e.id}')"></span>`; }).join('')}</div>` : '')
        : `<div class="cal-day-evs">${evs.slice(0,3).map(e=>{ const c=categoriaEvento(e.categoriaId); return `<div class="cal-ev-pill" style="background:${hexToRgba(c.color,0.16)};color:${c.color};" onclick="event.stopPropagation(); editarEvento('${e.id}')" title="${esc(e.titulo)}">${e.hora?esc(e.hora)+' ':''}${esc(e.titulo)}</div>`; }).join('')}${evs.length>3? `<div class="muted" style="font-size:10px;">+${evs.length-3} más</div>`:''}</div>`;
      semanasHtml += `<div class="cal-day ${compacto?'compact':''} ${enMes?'':'out'} ${fecha===hoy?'today':''}" onclick="abrirNuevoEvento('${fecha}')">
        <div class="cal-day-num">${parseInt(fecha.slice(8,10),10)}</div>
        ${evsHtml}
      </div>`;
    }
  }
  return `<div class="card" style="${compacto?'flex:0 0 auto;':''}">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:${compacto?'8px':'14px'};flex:0 0 auto;">
      <div style="display:flex;align-items:center;gap:${compacto?'4px':'10px'};">
        <button class="btn btn-icon" onclick="cambiarMesCalendario(-1)">‹</button>
        <h3 style="border:none;padding:0;margin:0;min-width:${compacto?'90px':'170px'};text-align:center;font-size:${compacto?'12px':''};">${compacto?mesesCortos[mesN-1]:meses[mesN-1]} ${anio}</h3>
        <button class="btn btn-icon" onclick="cambiarMesCalendario(1)">›</button>
      </div>
      <div style="display:flex;gap:6px;">
        ${compacto? '' : `<button class="btn btn-sm" onclick="state.calMes=thisMonth(); render();">Hoy</button>`}
        <button class="btn btn-primary btn-sm" onclick="abrirNuevoEvento('${hoy}')" title="Nuevo evento">${ICON_PLUS}${compacto?'':'Nuevo evento'}</button>
      </div>
    </div>
    <div class="cal-grid ${compacto?'compact':''}">
      <div class="cal-week-num head">Sem</div>
      ${['L','M','X','J','V','S','D'].map(d=>`<div class="cal-head">${d}</div>`).join('')}
      ${semanasHtml}
    </div>
    ${compacto? '' : `<div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;">
      ${getCategoriasEvento().map(c=>`<span style="display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-secondary);"><span style="width:9px;height:9px;border-radius:50%;background:${c.color};display:inline-block;"></span>${esc(c.nombre)}</span>`).join('')}
    </div>`}
  </div>`;
}

async function buscarSugerenciasDireccionObra(){
  const input = document.getElementById('ob-direccion');
  const q = input.value.trim();
  const box = document.getElementById('ob-direccion-sugerencias');
  const estadoEl = document.getElementById('ob-ubic-estado');
  clearTimeout(window.__dirSearchTimer);
  if(q.length<3){ box.style.display='none'; box.innerHTML=''; return; }
  window.__dirSearchTimer = setTimeout(async ()=>{
    // si el texto cambió mientras esperábamos, no seguimos con una búsqueda obsoleta
    if(document.getElementById('ob-direccion').value.trim()!==q) return;
    box.style.display=''; box.innerHTML = `<div class="hint" style="padding:8px;">Buscando…</div>`;
    const sugerencias = await buscarSugerenciasDireccion(q);
    if(document.getElementById('ob-direccion').value.trim()!==q) return;
    if(!sugerencias.length){ box.innerHTML = `<div class="hint" style="padding:8px;">Sin sugerencias. Prueba a escribir el nombre de la ciudad más claro.</div>`; return; }
    window.__dirSugerencias = sugerencias;
    box.innerHTML = sugerencias.map((s,i)=>`<div class="dropdown-item" style="white-space:normal;" onclick="elegirSugerenciaDireccionObra(${i})">📍 ${esc(s.nombre)}</div>`).join('');
  }, 450);
}
window.buscarSugerenciasDireccionObra = buscarSugerenciasDireccionObra;
async function buscarSugerenciasDireccion(q){
  try{
    let query = q;
    if(!/espa[ñn]a|spain/i.test(query)) query += ', España';
    const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=5&countrycodes=es&accept-language=es&q='+encodeURIComponent(query);
    const res = await fetch(url, {headers:{'Accept':'application/json'}});
    if(res.ok){
      const data = await res.json();
      if(data && data.length) return data.map(d=>({lat:parseFloat(d.lat), lng:parseFloat(d.lon), nombre:d.display_name}));
    }
  }catch(e){}
  const local = buscarCiudadLocal(q);
  return local? [local] : [];
}
function elegirSugerenciaDireccionObra(i){
  const s = (window.__dirSugerencias||[])[i]; if(!s) return;
  document.getElementById('ob-direccion').value = s.nombre;
  document.getElementById('ob-lat').value = s.lat;
  document.getElementById('ob-lng').value = s.lng;
  document.getElementById('ob-ubicnombre').value = s.nombre;
  document.getElementById('ob-direccion-sugerencias').style.display='none';
  const aviso = s.avisoRed? ' <span class="muted">(aproximado por ciudad)</span>' : '';
  document.getElementById('ob-ubic-estado').innerHTML = '📍 Ubicación seleccionada: '+esc(s.nombre.split(',').slice(0,3).join(','))+aviso;
}
